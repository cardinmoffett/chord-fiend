# Publishes the phone app (mobile/) to GitHub Pages on every push to main that touches it.
name: Publish phone app

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: mobile
        run: npm test
      - name: Collect the app files
        run: |
          mkdir site
          cp -r mobile/index.html mobile/manifest.webmanifest mobile/sw.js mobile/icons mobile/vendor site/
      - name: Stamp the version (run number in the editor; commit and publish time in Settings)
        run: |
          STAMP="${GITHUB_SHA::7} · $(date -u '+%b %-d %H:%M') UTC"
          sed -i "s/__APP_VERSION__/$STAMP/g" site/index.html
          sed -i "s/__APP_BUILD__/${{ github.run_number }}/g" site/index.html
          grep -q "$STAMP" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
