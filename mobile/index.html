<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chord Fiend</title>
<meta name="theme-color" content="#10121b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chord Fiend">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="vendor/Tone.js"></script>
<script>
  // Offline support when served over https (GitHub Pages); skipped when the file is opened directly.
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
</script>
<style>
  :root {
    --bg: #10121b;
    --bg-elevated: #171a26;
    --bg-panel: #1c202f;
    --line: #2a2f42;
    --line-soft: #23283a;
    --text: #eef0f6;
    --text-dim: #9198b3;
    --text-faint: #5c6280;
    --accent: #ffb454;
    --danger: #e0567a;

    /* Mode palette: warm = brighter/major-family modes, cool = darker/minor-family modes */
    --mode-thru: #4a5170;
    --mode-ionian: #ffb454;
    --mode-lydian: #ffd166;
    --mode-mixolydian: #f4a259;
    --mode-dorian: #5eb1bf;
    --mode-aeolian: #4a90c2;
    --mode-phrygian: #6a7fd6;
    --mode-locrian: #8b6fd6;
    --mode-harmonicminor: #d65a9e;
    --mode-melodicminor: #7fc8a9;
    --mode-phrygiandominant: #e0567a;

    --radius: 10px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overscroll-behavior: none; /* stops the browser's own pull-to-refresh /
      rubber-band bounce from firing when a drag inside the app (or a
      swipe that lands on non-interactive space) reaches a scroll edge --
      without this, that native gesture hijacks the touch and can
      visibly yank or refresh the whole page. */
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    overflow: hidden;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef0f6;
      --bg-elevated: #ffffff;
      --bg-panel: #ffffff;
      --line: #d8dce8;
      --line-soft: #e4e7f0;
      --text: #10121b;
      --text-dim: #4c5270;
      --text-faint: #9198b3;
    }
  }

  /* ---------- Header: master controls ---------- */
  header {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 10px 14px;
    padding: 10px 16px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    /* Never wraps to a second row -- if content is ever too wide for the
       screen, it scrolls horizontally instead of wrapping or clipping. */
  }
  header > * { flex-shrink: 0; }

  .brand {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
    color: var(--text);
    margin-right: 4px;
    white-space: nowrap;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 96px;
    flex: 0 1 auto;
  }

  .field select {
    width: 100%;
  }

  .field label {
    font-size: 10px;
    color: var(--text-faint);
    font-weight: 600;
  }

  select, input[type=number], input[type=text] {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 7px;
    padding: 6px 8px;
    font-size: 13px;
    font-family: inherit;
  }

  select:focus, input:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .spacer { flex: 1 1 auto; min-width: 0; }

  .transport {
    display: flex;
    gap: 8px;
    align-items: center;
    flex: 0 0 auto;
  }

  button.pill {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  button.pill:active { transform: translateY(1px); }
  button.pill.play {
    background: var(--accent);
    color: #1a1200;
    border-color: var(--accent);
  }
  button.pill.play.playing {
    background: var(--danger);
    color: white;
    border-color: var(--danger);
  }

  /* ---------- Timeline (measures stack vertically, scrollable) ---------- */
  main {
    flex: 1 1 auto;
    min-height: 0; /* lets THIS scroll internally, with the editor pinned below it,
                       instead of the whole page growing past the viewport and
                       pushing the timeline off-screen -- rows keep their fixed
                       height regardless of how much room is left. */
    overflow-y: auto;
    overscroll-behavior: contain; /* scrolling to its edge stays here, doesn't chain up into the page bounce */
    padding: 10px 16px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  /* ---------- Song view / section view containers ---------- */
  #songViewContainer, #sectionViewContainer, #learnHomeContainer {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }
  .hidden-view { display: none !important; }

  #songMain {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 12px 16px;
  }

  .chip-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* Arrangement: pinned to the top-left, normal fill order, takes whatever
     space is left and scrolls internally if it overflows. */
  .arrangement-grid {
    flex: 1 1 auto;
    overflow-y: auto;
    align-content: flex-start;
    padding-bottom: 10px;
  }

  .song-divider {
    flex: 0 0 auto;
    border-top: 1px solid var(--line);
    margin: 4px 0 10px;
  }

  /* Sections (the source palette): sized to its own content -- exactly one
     row by default, growing taller only if a second row becomes necessary.
     Normal left-to-right order WITHIN a row (item 1, item 2, ... then the
     "+" chip) -- only the ROW STACKING is reversed, so additional rows
     grow upward, keeping the palette anchored to the bottom of its area. */
  .palette-grid {
    flex: 0 0 auto;
    flex-wrap: wrap-reverse;
  }

  .chip {
    width: 108px;
    height: 72px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    padding: 6px;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  .chip.empty {
    border: 1.5px dashed var(--line);
    color: var(--text-faint);
    background: transparent;
  }
  .chip.filled {
    border: 1px solid var(--line-soft);
    background: var(--bg-elevated);
    color: var(--text);
  }
  .chip.armed {
    box-shadow: inset 0 0 0 3px var(--accent), 0 0 10px rgba(255,180,84,0.5);
  }
  .chip.sounding {
    filter: brightness(1.3);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.6);
  }
  .chip .chip-plus {
    font-size: 22px;
    color: var(--text-faint);
    line-height: 1;
  }
  .chip .chip-link-icon {
    position: absolute;
    top: 10px; right: 6px;
    font-size: 11px;
    line-height: 1;
    pointer-events: none;
    opacity: 0.9;
  }
  .editor.locked .editor-grid { opacity: 0.5; }
  .chip .chip-color-strip {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 7px;
    display: flex;
    border-radius: 9px 9px 0 0;
    overflow: hidden;
  }
  .chip .chip-name {
    font-size: 13px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
    margin-top: 6px;
  }
  .chip .chip-meta {
    font-size: 10px;
    color: var(--text-faint);
    margin-top: 2px;
  }

  .row {
    width: 100%;
    max-width: 640px;
    display: flex;
    background: var(--bg-elevated);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    overflow: hidden;
    height: 48px;
    flex-shrink: 0; /* without this, a flex child shrinks below its stated
      height by default once the container runs short of room -- the row's
      OWN fixed height doesn't actually protect it from that. This is what
      lets main's overflow-y:auto do its real job: the container scrolls
      because its rows genuinely don't fit, rather than every row quietly
      compressing to fit anyway. */
  }

  .row .segments {
    flex: 1;
    display: flex;
    position: relative;
  }

  .seg {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    transition: filter 0.08s ease;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: pan-y; /* blocks are most of the timeline's visible area, so
      a vertical drag almost always starts ON one -- touch-action:none here
      made that drag untouchable as a scroll gesture no matter what the
      container's own overflow/JS allowed. pan-y lets the browser treat a
      vertical drag starting here as a genuine scroll; the pointerdown
      below still fires immediately for a real tap (instant audio feedback),
      and pointercancel (already wired to release()) cleanly stops the
      held note the moment the browser takes the gesture over as a scroll. */
    /* Flex items refuse to shrink below their own text's width by default --
       without this, a segment with long chord-symbol text (like "Gm7 (Drop 3)")
       would force itself wider than its actual duration share, squeezing
       neighboring blocks out of their correct proportional width. */
    min-width: 0;
  }
  /* A dividing line only ever appears where a genuinely different block
     begins -- never at a fixed measure position, so a single block spanning
     across a measure boundary always reads as one seamless shape. */
  .seg.block-boundary { border-right: 1px solid rgba(0,0,0,0.18); }
  .seg .sym {
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 12px;
    font-weight: 600;
    color: rgba(0,0,0,0.75);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 4px;
    pointer-events: none;
  }
  .seg.selected {
    box-shadow: inset 0 0 0 3px var(--accent), 0 0 10px rgba(255,180,84,0.55);
    z-index: 1;
  }
  .seg.applied-chord {
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.55);
  }
  .seg.applied-chord.selected {
    box-shadow: inset 0 0 0 3px var(--accent), inset 0 0 0 1px rgba(255,255,255,0.7), 0 0 10px rgba(255,180,84,0.55);
  }
  .seg.sounding { filter: brightness(1.25); }
  .seg:active { filter: brightness(0.9); }

  .empty-row {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    color: var(--text-faint);
    font-size: 13px;
  }

  /* ---------- Persistent chord editor (docked bottom) ---------- */
  /* A draggable bottom sheet, like the place-details sheet in Maps: height
     is set directly via JS (see the drag handler) and snaps to one of two
     stops. Content is always fully rendered -- it's the SHEET's height that
     determines how much is visible, not which fields get built. */
  .editor {
    flex: 0 0 auto;
    background: var(--bg-panel);
    padding: 6px 16px calc(10px + var(--safe-bottom));
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .editor-handle {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px; /* a real touch target, not just the thin visual bar */
    padding: 6px 0;
    background: var(--bg-panel);
    border-top: 1px solid var(--line);
    cursor: grab;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .editor-handle-bar {
    width: 44px;
    height: 5px;
    border-radius: 3px;
    background: var(--text-faint);
  }







  .editor-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-end;
  }

  .block-actions {
    display: flex;
    gap: 6px;
    margin-left: auto;
  }

  button.icon {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 7px;
    width: 32px;
    height: 32px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button.icon:active { transform: translateY(1px); }
  button.icon.danger { color: var(--danger); }

  .toggle-row {
    display: flex;
    gap: 4px;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 2px;
  }
  .toggle-row button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    font-family: inherit;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 5px;
    cursor: pointer;
  }
  .toggle-row button.active {
    background: var(--accent);
    color: #1a1200;
  }

  .empty-state {
    color: var(--text-faint);
    font-size: 13px;
    padding: 6px 0;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  /* ---------- Settings panel ---------- */
  .settings-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: flex-start;
    justify-content: center;
    z-index: 50;
    padding-top: calc(60px + var(--safe-top));
  }
  .settings-backdrop.open { display: flex; }

  .settings-panel {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    width: min(320px, calc(100vw - 32px));
    max-height: calc(100vh - 90px - var(--safe-top) - var(--safe-bottom));
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .settings-panel h2 {
    margin: 0;
    font-size: 14px;
    color: var(--text-dim);
    font-weight: 700;
  }

  /* Rhythm editor: wider than a normal settings panel to give 16 columns
     real room, with its own horizontal scroll as a safety net on very
     narrow screens rather than ever squeezing cells unreadably small. */
  .rhythm-editor-panel {
    width: min(560px, calc(100vw - 24px));
  }
  /* The lesson's own narrative flows INSIDE the timeline's scrollable area
     now, as the first thing in it, rather than sitting in a separate fixed
     panel above it -- a long construction walkthrough no longer eats a
     fixed chunk of screen that pushes the actual blocks down; you scroll
     past the text to reach them, same as scrolling past any other content.
     Sized to match a .row's own width so it lines up visually with the
     blocks below it. */
  .lesson-intro {
    width: 100%;
    max-width: 640px;
    flex: 0 0 auto;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
    padding-bottom: 4px;
  }
  .lesson-reveal {
    width: 100%;
    max-width: 640px;
    flex: 0 0 auto;
    font-size: 12px;
    line-height: 1.4;
    color: var(--text); /* NOT var(--accent) as text color -- it's too close in
                            brightness to a white background to read reliably */
    min-height: 16px;
  }
  .lesson-reveal.found {
    background: rgba(255,180,84,0.16);
    border-left: 3px solid var(--accent);
    padding: 6px 10px;
    border-radius: 4px;
  }

  .learn-home-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .learn-unit-title {
    font-weight: 700;
    font-size: 13px;
    color: var(--text-dim);
    margin: 14px 0 4px;
  }
  .learn-unit-title:first-child { margin-top: 0; }
  .learn-lesson-row {
    width: 100%;
    text-align: left;
    padding: 12px 14px;
  }
  .learn-lesson-row .check {
    color: var(--accent);
    margin-right: 6px;
  }
  .learn-lesson-row[disabled] {
    opacity: 0.4;
  }

  .rhythm-editor-header {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .rhythm-editor-title {
    font-weight: 700;
    font-size: 14px;
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* A safe drag strip for panning the grid horizontally on a phone: the
     grid's own cells need touch-action:none so a note-length drag isn't
     hijacked as a page scroll, which as a side effect blocks a normal
     swipe-to-scroll there too. This strip is a separate, non-editing area
     that exists purely to pan the grid instead. */
  .rhythm-scroll-track {
    height: 20px;
    border-radius: 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    position: relative;
    touch-action: none;
    cursor: grab;
    flex: 0 0 auto;
  }
  .rhythm-scroll-thumb {
    position: absolute;
    top: 3px;
    bottom: 3px;
    left: 0;
    width: 100%;
    border-radius: 8px;
    background: var(--accent);
    opacity: 0.45;
    pointer-events: none;
  }
  .rhythm-grid {
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  .rhythm-row {
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .rhythm-row-label {
    width: 26px;
    flex: 0 0 26px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: right;
    padding-right: 4px;
  }
  .rhythm-cell {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
    border-radius: 4px;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    box-sizing: border-box;
  }
  .rhythm-cell.beat-start {
    border-left: 2px solid var(--line-strong, var(--line));
  }
  .rhythm-cell.drum-active {
    background: var(--text-dim);
    border-color: var(--text-dim);
  }
  /* A note's start cell is a full solid box -- the "note-on" moment.
     Every cell after it, for however long the note keeps ringing, shows a
     smaller box centered in the cell instead of another full one, so a
     long note reads as one clear onset plus a trailing sustain, the way a
     piano roll distinguishes a note's head from its held tail. */
  .rhythm-cell.bass-note-start {
    background: var(--accent);
    border-color: var(--accent);
  }
  .rhythm-cell.bass-continuation {
    position: relative;
  }
  .rhythm-cell.bass-continuation::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 42%; height: 42%;
    transform: translate(-50%, -50%);
    border-radius: 2px;
    background: var(--accent);
    opacity: 0.75;
  }
  .rhythm-cell.bass-drag-preview {
    background: var(--accent-dim, var(--accent));
    opacity: 0.6;
  }
  .rhythm-divider {
    height: 1px;
    background: var(--line);
    margin: 2px 0 2px 29px;
  }

  .settings-section {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 10px 0 -2px;
    padding-top: 10px;
    border-top: 1px solid var(--line-soft);
  }
  .settings-section:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }

  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .settings-row label { font-size: 13px; color: var(--text); }
  .settings-hint { font-size: 11px; color: var(--text-faint); margin-top: -6px; }
  .settings-row select, .settings-row input { width: 140px; }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  button.icon.gear {
    font-size: 17px;
  }
</style>
</head>
<body>

<div id="songViewContainer">
  <header>
    <button class="pill" id="projectNameBtn" style="max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></button>
    <div class="spacer"></div>
    <button class="icon" id="songLearnBtn" title="Learn">&#127891;</button>
    <button class="icon gear" id="songSettingsBtn" title="Settings">⚙</button>
    <button class="pill play" id="songPlayBtn">▶ Play</button>
  </header>
  <main id="songMain">
    <div id="arrangementGrid" class="chip-grid arrangement-grid"></div>
    <div class="song-divider"></div>
    <div id="sectionPaletteGrid" class="chip-grid palette-grid"></div>
  </main>
</div>

<div id="sectionViewContainer" class="hidden-view">
  <header>
    <button class="icon" id="backToSongBtn" title="Back to Song">←</button>

<script>
(function () {
"use strict";

/* ==== SHARED ENGINE START: copied from engine/src/engine.js by `npm run sync-engine`. Do not edit here. ==== */
// Chord Fiend chord engine.
//
// Extracted from original/modal-sketchpad.html (the 2026-10-04 snapshot). The code
// below is the app's own, copied line for line, with one kind of change: the five
// functions that read app-wide `state` now take those values as parameters.
//
//   getChordSymbol(chord, masterRootIndex)
//   appliedFunctionLabel(block, masterModeIndex)
//   bassOctaveShift(rootPitch, bassWrapLow)
//   computeBassPitchForBlock(block, chord, pattern, bassWrapLow)
//   activeBeatPattern(beatKey, customBeatPatterns)
//
// Two additions the app never had, both optional block fields, so a block without
// them builds exactly as the app's did:
//
//   flat5        lowers the chord's 5th a semitone (a ♭5), on any chord source
//   chordSource "free", with freeRoot (pitch class 0-11) and freeQuality
//                ("major" | "minor" | "dominant" | "diminished"): a chord on any root, not tied
//                to the key's scale, that takes every extension and voicing option
//
// Nothing here touches the DOM, audio, storage or timers.
// tests/test_matches_original.mjs checks that it gives the same answers as the app.

var MODES = {
  "Ionian":          [0,2,4,5,7,9,11],
  "Dorian":          [0,2,3,5,7,9,10],
  "Phrygian":        [0,1,3,5,7,8,10],
  "Lydian":          [0,2,4,6,7,9,11],
  "Mixolydian":      [0,2,4,5,7,9,10],
  "Aeolian":         [0,2,3,5,7,8,10],
  "Locrian":         [0,1,3,5,6,8,10],
  "HarmonicMinor":   [0,2,3,5,7,8,11],
  "MelodicMinor":    [0,2,3,5,7,9,11],
  "PhrygianDominant":[0,1,4,5,7,8,10]
};

var DEGREE_NAMES = ["I","ii","iii","IV","V","vi","vii"];
var DEGREE_INDEX = {"I":0,"ii":1,"iii":2,"IV":3,"V":4,"vi":5,"vii":6};
var BLOCK_MODE_NAMES = ["Thru","Ionian","Dorian","Phrygian","Lydian","Mixolydian","Aeolian","Locrian","HarmonicMinor","MelodicMinor","PhrygianDominant"];
var MASTER_MODE_NAMES = ["Ionian","Dorian","Phrygian","Lydian","Mixolydian","Aeolian","Locrian","HarmonicMinor","MelodicMinor","PhrygianDominant"];
var EXTENSION_NAMES = ["triad","6","7","9","11","13"];
var EXTENSION_TONE_COUNT = {"triad":3,"7":4,"9":5,"11":6,"13":7};
var SUS_NAMES = ["none","sus2","sus4"];
var DROP_NAMES = ["Close","Drop 2","Drop 3","Drop 2+4"];
var NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
var NOTE_NAMES_FLAT = ["C","D\u266D","D","E\u266D","E","F","G\u266D","G","A\u266D","A","B\u266D","B"];
// Which reference major-key root (by pitch class) is conventionally spelled
// with flats, per the circle of fifths (F, Bb, Eb, Ab, Db -- and enharmonic
// Gb/F# is treated as sharp-side here since F# major is the far more common
// spelling in practice).
var FLAT_PREFERRING_MAJOR_ROOT = [false,true,false,true,false,true,false,false,true,false,true,false];
// Semitones to SUBTRACT from a mode's own root to find the reference major
// key whose sharp/flat convention that mode follows. Church modes map to a
// rotation of the major scale (e.g. Aeolian is degree 6, so subtract 9);
// HarmonicMinor and MelodicMinor conventionally keep natural minor's own
// key signature (same offset as Aeolian), with their raised degrees written
// as accidentals rather than changing the signature. PhrygianDominant is
// the 5th mode of harmonic minor, derived the same way (verified directly
// against the circle of fifths, not assumed).
var MASTER_MODE_RELATIVE_MAJOR_OFFSET = [0, 2, 4, 5, 7, 9, 11, 9, 9, 4];
function keyPrefersFlats(rootIndex, modeIndex) {
  var offset = MASTER_MODE_RELATIVE_MAJOR_OFFSET[modeIndex];
  var refRoot = ((rootIndex - offset) % 12 + 12) % 12;
  return FLAT_PREFERRING_MAJOR_ROOT[refRoot];
}
var NOTE_NAME_TO_OFFSET = {"C":0,"C#":1,"D":2,"D#":3,"E":4,"F":5,"F#":6,"G":7,"G#":8,"A":9,"A#":10,"B":11};
var DURATION_NAMES = ["4/1","2/1","1/1","1/2","1/4","1/8","1/16"];
var DURATION_BEATS = {"4/1":16,"2/1":8,"1/1":4,"1/2":2,"1/4":1,"1/8":0.5,"1/16":0.25};
var DURATION_MODIFIER_NAMES = ["Straight","Dotted","Triplet"];

function buildExtendedScale(modeIntervals, length) {
  var out = [];
  for (var i = 0; i < length; i++) {
    var lap = Math.floor(i / 7), step = i % 7;
    out.push(modeIntervals[step] + lap * 12);
  }
  return out;
}

// "Drop 2" means: lower the SECOND-HIGHEST sounding note by an octave (Drop 3:
// the third-highest; Drop 2+4: second- and fourth-highest). That is defined
// against the chord's close voicing in PITCH order. The notes arrive here in
// TONE order, though -- an inversion lifts its lowest tones an octave without
// re-sorting -- so counting from the end of the array lowered whichever TONE
// was second from last, not whichever NOTE was second from the top. On an
// inverted chord that was the wrong note: Drop 2 on a first-inversion C triad
// (E G C) lowered the E instead of the G, and Drop 3 undid the inversion
// altogether. Sorting first makes "from the top" mean from the top.
function applyDrops(pitches, dropIndex) {
  var p = pitches.slice().sort(function (a,b) { return a-b; }), n = p.length;
  function dropAt(fromTop) { var idx = n - fromTop; if (idx >= 0 && idx < n) p[idx] -= 12; }
  if (dropIndex === 1) dropAt(2);
  else if (dropIndex === 2) dropAt(3);
  else if (dropIndex === 3) { dropAt(2); dropAt(4); }
  p.sort(function (a,b) { return a-b; });
  return p;
}

// Roman-numeral labels for the seven degrees of a mode, derived from the
// mode's own scale so they always match what the chord engine plays:
//   - case shows quality (UPPER = major, lower = minor)
//   - ° = diminished, + = augmented
//   - a flat/sharp shows where the root sits against the parallel major, the
//     standard frame for modal interchange (Aeolian: i ii° ♭III iv v ♭VI ♭VII)
var ROMAN_BASE = ["I", "II", "III", "IV", "V", "VI", "VII"];
function degreeLabels(modeName) {
  var mode = MODES[modeName];
  var major = MODES["Ionian"];
  var labels = [];
  for (var d = 0; d < 7; d++) {
    var root = mode[d];
    // the triad stacked in thirds from this degree, wrapping into the next octave
    var third = mode[(d + 2) % 7] + (d + 2 >= 7 ? 12 : 0);
    var fifth = mode[(d + 4) % 7] + (d + 4 >= 7 ? 12 : 0);
    var t = third - root, f = fifth - root;
    var numeral = ROMAN_BASE[d];
    if (t === 3) numeral = numeral.toLowerCase();          // minor or diminished
    var suffix = "";
    if (t === 3 && f === 6) suffix = "\u00B0";             // diminished
    else if (t === 4 && f === 8) suffix = "+";             // augmented
    var shift = root - major[d];
    var accidental = shift < 0 ? "\u266D" : (shift > 0 ? "\u266F" : "");
    labels.push(accidental + numeral + suffix);
  }
  return labels;
}

function buildChord(block, masterRootIndex, masterModeIndex) {
  var blockModeName = BLOCK_MODE_NAMES[block.blockModeIndex];
  var isThru = blockModeName === "Thru";
  var resolvedMode = isThru ? MASTER_MODE_NAMES[masterModeIndex] : blockModeName;
  var modeIntervals = MODES[resolvedMode];

  var extensionName = EXTENSION_NAMES[block.extensionIndex];
  var is6 = extensionName === "6";
  var toneCount = is6 ? 3 : EXTENSION_TONE_COUNT[extensionName];
  var susName = SUS_NAMES[block.susIndex];

  var isApplied = block.chordSource === "applied";
  var isFree = block.chordSource === "free";
  var fn = isApplied ? (block.appliedFunction || "dominant") : null;
  var degreeIndex, chordRootOffset, offsets;
  var effectiveSus = susName, effectiveAug = !!block.aug, effectiveIs6 = is6;
  var effectiveFlat5 = !block.aug && !!block.flat5;

  if (isFree) {
    // FREE: a root anywhere, measured up from the key's root so the octave
    // setting means the same as for every other block, with a fixed quality.
    var quality = FREE_QUALITY_INTERVALS[block.freeQuality] ? block.freeQuality : "major";
    var qualityIntervals = FREE_QUALITY_INTERVALS[quality];
    degreeIndex = -1; // not a degree of the key
    chordRootOffset = (((block.freeRoot || 0) - masterRootIndex) % 12 + 12) % 12;
    offsets = is6 ? qualityIntervals.slice(0, 3).concat([9]) : qualityIntervals.slice(0, toneCount);
    if (susName === "sus2") offsets[1] = 2;
    else if (susName === "sus4") offsets[1] = 5;
    if (block.aug) offsets[2] = 8;
    else if (effectiveFlat5) offsets[2] = 6;
  } else if (isApplied) {
    // The target's OWN diatonic root -- same scale-walk the plain diatonic
    // path below uses, just to locate where the target sits, not to shape
    // the applied chord's own quality (that's fixed by the function).
    var targetIndex = block.appliedTargetIndex || 0;
    var targetExtended = buildExtendedScale(modeIntervals, targetIndex + 8);
    var targetRootOffset = targetExtended[targetIndex];
    degreeIndex = targetIndex; // reused below for pitch base + display

    if (fn === "leadingTone") {
      chordRootOffset = targetRootOffset - 1; // a half-step below the target
      offsets = DIMINISHED7_INTERVALS.slice(); // always this exact tetrad
      effectiveSus = "none"; effectiveAug = false; effectiveIs6 = false; // not meaningful on a fixed dim7
      effectiveFlat5 = false; // already has one
    } else {
      chordRootOffset = targetRootOffset + (fn === "tritoneSub" ? 1 : 7);
      if (is6) {
        offsets = DOMINANT_INTERVALS.slice(0, 3).concat([9]); // triad + a plain major 6th
      } else {
        offsets = DOMINANT_INTERVALS.slice(0, toneCount);
        if (susName === "sus2") offsets[1] = 2; // fixed major 2nd -- not scale-derived, dominant quality is fixed
        else if (susName === "sus4") offsets[1] = 5; // fixed perfect 4th
        if (block.aug) offsets[2] = 8;
        else if (effectiveFlat5) offsets[2] = 6;
      }
    }
  } else {
    var degree = DEGREE_NAMES[block.degreeIndex];
    degreeIndex = DEGREE_INDEX[degree];
    var extended = buildExtendedScale(modeIntervals, degreeIndex + Math.max(toneCount,4)*2 + 7);
    chordRootOffset = extended[degreeIndex];
    offsets = [];
    for (var k = 0; k < toneCount; k++) offsets.push(extended[degreeIndex + k*2] - chordRootOffset);
    if (susName === "sus2") offsets[1] = extended[degreeIndex+1] - chordRootOffset;
    else if (susName === "sus4") offsets[1] = extended[degreeIndex+3] - chordRootOffset;
    if (block.aug) offsets[2] = 8;
    else if (effectiveFlat5) offsets[2] = 6;
    if (is6) offsets.push(extended[degreeIndex+5] - chordRootOffset);
  }

  var base = 60 + NOTE_NAME_TO_OFFSET[NOTE_NAMES[masterRootIndex]] + block.octave*12;
  var chordRootPitch = base + chordRootOffset;
  // Each tone keeps its label through the sort, so toneLabels[i] always
  // names exactly the note that is i-th from the bottom in root position --
  // which is also exactly what inversion i puts in the bass.
  var roles = chordToneRoles(offsets.length, effectiveSus, effectiveIs6);
  var tones = offsets.map(function (o, i) {
    return {pitch: chordRootPitch + o, label: chordToneLabel(o, roles[i])};
  });
  tones.sort(function (a, b) { return a.pitch - b.pitch; });
  var pitches = tones.map(function (t) { return t.pitch; });
  var toneLabels = tones.map(function (t) { return t.label; });

  var maxInv = Math.max(0, pitches.length-1);
  var inv = Math.min(Math.max(block.inversion||0,0), maxInv);
  // Inversion i puts tone i in the bass: every tone below it moves up an
  // octave. For ordinary chords one octave always clears it. The 9th, 11th
  // and 13th are the exception -- they sit more than an octave above the root
  // (14, 17, 21 semitones), so the root lifted a single octave (12) still
  // lands BELOW a 9th, and "9 in the bass" used to play the root. Keep lifting
  // until the chosen tone really is the lowest note, so the label is true.
  var bassPitch = pitches[inv];
  for (var n = 0; n < inv; n++) {
    pitches[n] += 12;
    while (pitches[n] <= bassPitch) pitches[n] += 12;
  }

  pitches = applyDrops(pitches, block.dropIndex||0);

  return {pitches:pitches, chordRootPitch:chordRootPitch, offsets:offsets, toneLabels:toneLabels, inversion:inv, sus:effectiveSus, aug:effectiveAug, is6:effectiveIs6,
          dropIndex:block.dropIndex||0, resolvedMode:resolvedMode, isThru:isThru,
          chordDegreeIndex:degreeIndex, blockOctave:block.octave,
          isApplied:isApplied, appliedFunction:fn,
          isFree:isFree, flat5:effectiveFlat5 && offsets[2] === 6};
}

function pitchToNoteName(pitch, preferFlats) { return (preferFlats ? NOTE_NAMES_FLAT : NOTE_NAMES)[((pitch%12)+12)%12]; }
function pitchToFullNoteName(pitch) { return pitchToNoteName(pitch) + (Math.floor(pitch / 12) - 1); }

// A dropdown for CHOOSING a note has to offer both names of a black key --
// pitch class 1 is C-sharp to one player and D-flat to another, and a list that
// only says one reads as though the other isn't there. (This is just the label:
// each option's value, and so everything saved or played, is the same number.)
function noteChoiceLabel(pitchClass, octave) {
  var oct = octave === undefined ? "" : String(octave);
  var sharp = NOTE_NAMES[pitchClass].replace("#", "\u266F");
  var flat = NOTE_NAMES_FLAT[pitchClass];
  return sharp === flat ? sharp + oct : sharp + oct + "/" + flat + oct;
}

function getChordSymbol(chord, masterRootIndex) {
  // Anchored at the HOME root but using the CHORD's OWN effective mode
  // (resolvedMode already correctly reflects a borrowed mode, not just the
  // home one) -- this is what makes a borrowed bVI spell as Ab even in a
  // sharp-leaning major home key, since Aeolian's own relative-major offset
  // governs it, not the home key's. Tritone substitutions are a stronger,
  // near-universal exception to that: they're conventionally always written
  // with flats regardless of the surrounding key, since the whole function
  // of the chord is named and recognized by its flat-side spelling (Db7, Gb7),
  // so that overrides the general rule here.
  var preferFlats = chord.isApplied && chord.appliedFunction === "tritoneSub"
    ? true
    : keyPrefersFlats(masterRootIndex, MASTER_MODE_NAMES.indexOf(chord.resolvedMode));
  var rootName = pitchToNoteName(chord.chordRootPitch, preferFlats);
  var o = chord.offsets, third=o[1], fifth=o[2], seventh = o.length>3 && !chord.is6 ? o[3] : undefined;
  var base;
  if (chord.sus === "sus2" || chord.sus === "sus4") {
    var d = chord.is6?"6":(o.length===4?"7":o.length===5?"9":o.length===6?"11":o.length===7?"13":"");
    base = rootName + d + chord.sus + (chord.flat5 ? "b5" : "");
  } else {
    var q;
    if (chord.aug) q = "aug";
    else if (third===4 && fifth===7) q = "maj";
    else if (third===3 && fifth===7) q = "min";
    else if (third===3 && fifth===6) q = "dim";
    else if (third===4 && fifth===8) q = "aug";
    else if (third===4 && fifth===6) q = "b5";
    else q = "?";
    if (chord.is6) base = q==="maj" ? rootName+"6" : q==="min" ? rootName+"m6" : q==="b5" ? rootName+"6(b5)" : rootName+q+"6";
    else if (o.length===3) base = q==="maj"?rootName : q==="min"?rootName+"m" : q==="dim"?rootName+"dim" : q==="aug"?rootName+"aug" : q==="b5"?rootName+"(b5)" : rootName+"?";
    else {
      var d2 = o.length===4?"7":o.length===5?"9":o.length===6?"11":o.length===7?"13":"";
      if (q==="maj" && seventh===11) base = rootName+"maj"+d2;
      else if (q==="maj" && seventh===10) base = rootName+d2;
      else if (q==="min" && seventh===10) base = rootName+"m"+d2;
      else if (q==="min" && seventh===11) base = rootName+"m(maj"+d2+")";
      else if (q==="dim" && seventh===9) base = rootName+"dim"+d2;
      else if (q==="dim" && seventh===10) base = rootName+"m"+d2+"b5";
      else if (q==="aug" && seventh===11) base = rootName+"maj"+d2+"#5";
      else if (q==="b5" && seventh===10) base = rootName+d2+"b5";
      else if (q==="b5" && seventh===11) base = rootName+"maj"+d2+"b5";
      else base = rootName+"?"+d2;
    }
  }
  if (chord.dropIndex > 0) base += " (" + DROP_NAMES[chord.dropIndex] + ")";
  return base;
}

function getDurationBeats(block) {
  var base = DURATION_BEATS[DURATION_NAMES[block.durationIndex]];
  if (block.durationModifier === 1) return base * 1.5;

// triad with no 7th to reference.
function chordTonePitch(chord, slot) {

  return chord.chordRootPitch + chord.offsets[slot];

// octave up would both get wrapped back to the identical spot.
function bassOctaveShift(rootPitch, bassWrapLow) {

  while (rootPitch + shift >= wrapLow + 12) shift -= 12;

}

function computeBassPitchForBlock(block, chord, pattern, bassWrapLow) {

  // One time only: projects still carrying the old placeholder names
  // ("Project 1", "Untitled", ...) get a generated title. Guarded by a flag
  // so a name you later choose yourself is never touched.
  if (!projectsStore.namesGenerated) {
    projectsStore.projects.forEach(function (p) {
      if (/^(Project|Untitled)( \d+)?$/.test(p.name)) p.name = generateProjectName();
    });
    projectsStore.namesGenerated = true;
  }

  // One time only: the reverb default moved from 26%/Medium to 75%/Cavernous.
  // Saved projects carry their OWN reverb values, so changing freshState()
  // alone would leave every existing project on the old sound. Only projects
  // still sitting on EXACTLY the old default pair are moved -- a value that
  // specific (26%, not a round number) is almost certainly untouched -- and
  // the flag means a setting chosen afterward is never overridden again.
  if (!projectsStore.reverbDefaultsMigrated) {
    projectsStore.projects.forEach(function (p) {
      if (p.data && p.data.reverbWet === 0.26 && p.data.reverbDecay === 1.6) {
        p.data.reverbWet = 0.75;
        p.data.reverbDecay = 5;

    projectsStore.reverbDefaultsMigrated = true;
  }

  // alongside the shared palette rather than inside a project's own data,
  // so it's here whether the store is brand new or an older one that
  // predates this feature.
  if (!projectsStore.learnProgress) projectsStore.learnProgress = {completedLessons: []};

  // Per-INSTRUMENT volume trims, in dB, keyed by instrument name. Like the
  // palette and Learn progress, these belong to the person rather than any one
  // project: how loud an instrument needs to be to sit well is a fact about
  // the instrument (some voices are simply hotter than others), so it should
  // follow that instrument into every project instead of being re-tuned each time.
  if (!projectsStore.instrumentTrims) projectsStore.instrumentTrims = {};

  var active = activeProject() || projectsStore.projects[0];
  projectsStore.activeId = active.id;
  // Merge onto fresh defaults so a project saved before a newer setting
  // existed still gets a sensible value for it.
  active.data = Object.assign(freshState(), active.data);
  state = active.data;
  state.palette = projectsStore.palette || state.palette;
  healLinks(state);

function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

// without needing dev tools connected to a desktop.
var debugLogLines = [];

    return typeof a === "object" ? JSON.stringify(a) : String(a);

// Triangle (not sine) as the clean base -- a pure sine has NO overtones at
// all, so stacking several close together (as chord tones naturally are)
// gives the ear nothing to separate them by, just a pile of isolated spikes
// in the same low-mid range. A little harmonic content actually helps
// clarity. A shared high-pass filter (below) also cuts low rumble that
// compounds when multiple notes sound together.
var SYNTH_BUILDERS = {
  soft: function () {
    return new Tone.PolySynth(Tone.Synth, {
      oscillator: {type: "triangle"},
      envelope: {attack: 0.02, decay: 0.25, sustain: 0.7, release: 0.6}
    });
  },
  airy: function () {
    // Real airiness comes from upper-harmonic presence, not the absence of
    // harmonics -- a light detune spread + high-pass gives shimmer without bulk.
    // Volume pulled back to compensate for 2 oscillators per note (8 total
    // for a 4-note chord), which was clipping without this headroom.
    var s = new Tone.PolySynth(Tone.Synth, {
      oscillator: {type: "fatsine", count: 2, spread: 15},
      envelope: {attack: 0.18, decay: 0.3, sustain: 0.65, release: 1.1}
    });
    s.volume.value = -7;
    return s;
  },
  glass: function () {
    return new Tone.PolySynth(Tone.Synth, {
      oscillator: {type: "triangle8"}, // triangle with more of its (still mild) upper partials present
      envelope: {attack: 0.01, decay: 0.4, sustain: 0.4, release: 0.8}
    });
  },
  piano: function () {

    // toward near-silence even while held, rather than sustaining flat forever.
    return new Tone.PolySynth(Tone.Synth, {
      oscillator: {type: "triangle"},
      envelope: {attack: 0.004, decay: 2.8, sustain: 0.05, release: 0.4}
    });
  },
  rich: function () {
    // Real unison (3 detuned oscillators per note) + a filter with its OWN
    // envelope (opens/closes over the note's sustain, giving movement
    // instead of a static tone) -- the two techniques that most separate a
    // properly-built synth voice from a bare single oscillator. Volume
    // pulled back hard: 3-voice unison across a 4-note chord is a lot of
    // stacked energy, the same lesson "Airy" taught earlier.
    var s = new Tone.PolySynth(Tone.MonoSynth, {
      oscillator: {type: "fatsawtooth", count: 3, spread: 20},
      envelope: {attack: 0.015, decay: 0.3, sustain: 0.55, release: 0.7},
      filter: {type: "lowpass", Q: 1.2, rolloff: -24},
      filterEnvelope: {attack: 0.05, decay: 0.35, sustain: 0.3, release: 0.8,
                        baseFrequency: 250, octaves: 3.5, exponent: 2}
    });

    return s;
  },
  slowpad: function () {
    // The filter's OWN attack is slow too, matching the amp envelope -- so
    // brightness blooms in gradually alongside volume, not just loudness.
    // 4-voice unison, wide spread, for real lushness on a sustained texture.
    var s = new Tone.PolySynth(Tone.MonoSynth, {
      oscillator: {type: "fatsawtooth", count: 4, spread: 30},
      envelope: {attack: 1.4, decay: 0.6, sustain: 0.85, release: 2.2},
      filter: {type: "lowpass", Q: 0.8, rolloff: -24},
      filterEnvelope: {attack: 1.8, decay: 0.8, sustain: 0.6, release: 2.5,
                        baseFrequency: 180, octaves: 4, exponent: 2}
    });

    return s;
  },
  pluck2: function () {

    // gives an analog-poly "pluck" its characteristic snap -- distinct from
    // the simpler, filter-less Pluck option earlier.
    var s = new Tone.PolySynth(Tone.MonoSynth, {
      oscillator: {type: "fatsawtooth", count: 2, spread: 15},
      envelope: {attack: 0.003, decay: 0.25, sustain: 0.1, release: 0.3},
      filter: {type: "lowpass", Q: 1.5, rolloff: -24},
      filterEnvelope: {attack: 0.002, decay: 0.18, sustain: 0.05, release: 0.25,
                        baseFrequency: 300, octaves: 5, exponent: 2}
    });
    s.volume.value = -8;
    return s;
  },
  brass: function () {

    // with volume, the way a real horn's timbre opens up as it's blown harder.
    var s = new Tone.PolySynth(Tone.MonoSynth, {
      oscillator: {type: "fatsawtooth", count: 3, spread: 18},
      envelope: {attack: 0.12, decay: 0.15, sustain: 0.8, release: 0.5},
      filter: {type: "lowpass", Q: 2, rolloff: -24},
      filterEnvelope: {attack: 0.35, decay: 0.2, sustain: 0.7, release: 0.6,

  darkpad: function () {

    // more slowly-moving filter for a moodier, more mysterious texture --
    // a deliberate contrast to the brighter Slow Pad above.
    var s = new Tone.PolySynth(Tone.MonoSynth, {
      oscillator: {type: "fatsine", count: 3, spread: 25},
      envelope: {attack: 2.0, decay: 1.0, sustain: 0.8, release: 3.0},
      filter: {type: "lowpass", Q: 0.6, rolloff: -12},
      filterEnvelope: {attack: 2.5, decay: 1.5, sustain: 0.4, release: 3.0,

  epiano: function () {

    // whole-number ratio gives the bell-like "tine" at the attack, and a
    // modulation envelope that dies away FASTER than the amplitude envelope

    // the exact mechanism behind the Rhodes/DX7 sound, not just a filtered
    // triangle pretending to be one.

      harmonicity: 3,
      modulationIndex: 1.6,
      oscillator: {type: "sine"},
      envelope: {attack: 0.004, decay: 1.6, sustain: 0.18, release: 0.9},
      modulation: {type: "sine"},
      modulationEnvelope: {attack: 0.002, decay: 0.45, sustain: 0.05, release: 0.6}

  },
  vibes: function () {

    // produces the faint inharmonic shimmer of struck metal bars; long
    // decay with almost no sustain is what makes it ring and fade rather
    // than hold like an organ.
    var s = new Tone.PolySynth(Tone.FMSynth, {
      harmonicity: 3.01,
      modulationIndex: 2.2,
      oscillator: {type: "sine"},
      envelope: {attack: 0.003, decay: 2.4, sustain: 0.02, release: 1.4},
      modulation: {type: "sine"},
      modulationEnvelope: {attack: 0.002, decay: 0.9, sustain: 0.01, release: 0.8}
    });
    s.volume.value = -9;
    return s;
  },
  marimba: function () {

    // modulation burst gives the hollow, knocking attack, with a quick,
    // fully-dead decay -- far shorter than vibes, no ring-out at all.
    var s = new Tone.PolySynth(Tone.FMSynth, {
      harmonicity: 4,
      modulationIndex: 3.2,
      oscillator: {type: "sine"},
      envelope: {attack: 0.002, decay: 0.7, sustain: 0, release: 0.35},
      modulation: {type: "sine"},
      modulationEnvelope: {attack: 0.001, decay: 0.12, sustain: 0, release: 0.2}
    });
    s.volume.value = -8;
    return s;
  },
  strings: function () {
    // A string section is many slightly-detuned players: a wide, 5-voice
    // sawtooth unison. The attack is slow enough to feel bowed rather than
    // struck, but much faster than the Slow Pad, and the filter opens WITH
    // the swell so the tone brightens as the section digs in.
    var s = new Tone.PolySynth(Tone.MonoSynth, {
      oscillator: {type: "fatsawtooth", count: 5, spread: 28},
      envelope: {attack: 0.55, decay: 0.4, sustain: 0.85, release: 1.1},
      filter: {type: "lowpass", Q: 0.7, rolloff: -24},
      filterEnvelope: {attack: 0.7, decay: 0.5, sustain: 0.75, release: 1.2,
                        baseFrequency: 500, octaves: 3, exponent: 1.5}
    });
    s.volume.value = -12;
    return s;
  },
  organ: function () {
    // Additive synthesis: a custom oscillator built from explicit partials
    // mimics a drawbar organ's stacked harmonics (fundamental, octave, fifth
    // above, two octaves...). An organ has no real decay or release tail --
    // it sounds fully at once and cuts off clean -- so the envelope is
    // nearly rectangular, which is what separates it from every sustained
    // pad above.
    var s = new Tone.PolySynth(Tone.Synth, {
      oscillator: {type: "custom", partials: [1, 0.75, 0.55, 0.4, 0.25, 0.18, 0.1]},
      envelope: {attack: 0.012, decay: 0.05, sustain: 0.95, release: 0.12}
    });
    s.volume.value = -11;
    return s;
  },
  choir: function () {
    // Amplitude modulation at a slow rate gives a gentle vocal-like
    // "breathing" swell on a soft, sine-based tone; a slow attack and long
    // release let the voices bloom and linger like a held vowel instead of
    // starting and stopping abruptly.
    var s = new Tone.PolySynth(Tone.AMSynth, {
      harmonicity: 1.005,
      oscillator: {type: "sine"},
      envelope: {attack: 0.9, decay: 0.5, sustain: 0.85, release: 1.8},
      modulation: {type: "sine"},
      modulationEnvelope: {attack: 1.2, decay: 0.5, sustain: 0.9, release: 1.8}
    });
    s.volume.value = -9;
    return s;
  }
};

var toneReady = false;
var synth = null;
var heldFreqs = [];
var masterReverb = null;
var masterHighpass = null;
var masterSaturation = null;
var masterChorus = null;
var masterDelay = null;

var masterLimiter = null;

function delayTimeSeconds() {
  var beats = DURATION_BEATS[DURATION_NAMES[state.delayTimeIndex]] || 0.5;
  return beats * (60 / (state.tempo || 100));
}

function ensureEffectsChain() {
  if (!masterHighpass) {
    // Subtle saturation for analog-style warmth -- a LOW amount, meant to be
    // felt more than heard, not obvious distortion.
    masterSaturation = new Tone.Distortion({distortion: 0.15, wet: 0.3});
    // Cuts low-mid buildup BEFORE the reverb, so the reverb tail carries
    // forward a cleaner signal instead of sustaining the mud.
    masterHighpass = new Tone.Filter({type: "highpass", frequency: 160, rolloff: -12});
    // Chorus for width/richness -- the classic trick for turning a flat,
    // one-dimensional tone into something that feels bigger.
    masterChorus = new Tone.Chorus({frequency: 1.1, delayTime: 3.5, depth: 0.45, wet: 0.35}).start();
    masterDelay = new Tone.FeedbackDelay({delayTime: delayTimeSeconds(), feedback: state.delayFeedback, wet: state.delayWet});
    masterReverb = new Tone.Reverb({decay: state.reverbDecay, wet: state.reverbWet});
    // Brickwall safety net -- protects against clipping regardless of how
    // many voices/oscillators stack up (chords, fat oscillators, etc.).
    masterLimiter = new Tone.Limiter(-1);

    masterSaturation.connect(masterHighpass);
    masterHighpass.connect(masterChorus);
    masterChorus.connect(masterDelay);
    masterDelay.connect(masterReverb);
    masterReverb.connect(masterLimiter);
    masterLimiter.toDestination();
  }
}

// Each builder above hand-balances its own volume (-7, -9, -12...) so the
// instruments start roughly even. The person's trim sits ON TOP of that, so
// 0 dB always means "as designed" and the numbers stay meaningful even if a
// builder's baked-in level is retuned later.
var INSTRUMENT_TRIM_MIN = -18;
var INSTRUMENT_TRIM_MAX = 12;
var synthBaseVolume = 0;

// An unknown/legacy instrument name plays as "soft" (see rebuildSynth), so
// its trim has to be filed under "soft" too -- not under a name that never sounds.
function resolvedInstrumentName() {
  return SYNTH_BUILDERS[state.instrument] ? state.instrument : "soft";
}
function instrumentTrim(name) {
  var t = projectsStore.instrumentTrims[name];
  if (typeof t !== "number" || !isFinite(t)) return 0;
  return Math.max(INSTRUMENT_TRIM_MIN, Math.min(INSTRUMENT_TRIM_MAX, t));
}
function applyInstrumentTrim() {
  if (synth) synth.volume.value = synthBaseVolume + instrumentTrim(resolvedInstrumentName());
}

function rebuildSynth() {
  if (synth) { try { synth.dispose(); } catch (e) {} }
  var build = SYNTH_BUILDERS[resolvedInstrumentName()];
  synth = build();
  synthBaseVolume = synth.volume.value; // the level this builder balanced the voice at, before any trim
  applyInstrumentTrim();
  synth.connect(masterSaturation);
}

// Dedicated bass voice -- deliberately bypasses the shared high-pass filter
// (which exists specifically to cut low content, exactly what bass needs)
// and the reverb (bass usually reads clearer tight/dry). Still runs through
// the limiter for clip protection.
var bassSynth = null;
function ensureBassSynth() {

      oscillator: {type: "triangle"},
      envelope: {attack: 0.008, decay: 0.15, sustain: 0.8, release: 0.15}

// Tone.js requires its own explicit start() inside a user gesture, same
// underlying reason raw AudioContext needed resume() -- and same risk of
// silent failure if something plays before that start() has really finished.
function ensureAudioReady(callback) {
  if (toneReady) { callback(); return; }
  Tone.start().then(function () {
    toneReady = true;
    ensureEffectsChain();
    rebuildSynth();
    ensureBassSynth();
    callback();
  }).catch(function (e) {
    console.error("Tone.start() failed:", e);

}

function holdPitches(pitches) {
  if (heldFreqs.length) {
    // A previous hold's release was somehow missed -- a defensive backstop
    // alongside the pointer-capture fix above, not a substitute for it.
    // Don't let a stuck note silently keep ringing underneath a new one.
    logAudio("holdPitches: releasing a STUCK previous hold first", heldFreqs);
    if (synth) synth.triggerRelease(heldFreqs);
    heldFreqs = [];
  }
  ensureAudioReady(function () {
    heldFreqs = pitches.map(midiToFreq);
    logAudio("holdPitches triggerAttack", heldFreqs);
    synth.triggerAttack(heldFreqs);
  });
}
function releaseHeld() {
  if (synth && heldFreqs.length) {
    logAudio("releaseHeld triggerRelease", heldFreqs);
    synth.triggerRelease(heldFreqs); heldFreqs = [];
  }
}
function playPitchesTimed(pitches, durationSeconds) {
  ensureAudioReady(function () {
    logAudio("playPitchesTimed triggerAttackRelease", pitches, durationSeconds);
    synth.triggerAttackRelease(pitches.map(midiToFreq), durationSeconds);

}

  if (synth) { logAudio("sequenceStop releaseAll"); synth.releaseAll(); }

var kickSynth = null, snareSynth = null, hihatSynth = null;
function ensureDrumSynths() {
  if (!kickSynth) {

      pitchDecay: 0.05, octaves: 6,
      envelope: {attack: 0.001, decay: 0.35, sustain: 0}
    }).toDestination();
    kickSynth.volume.value = -6;

    snareSynth = new Tone.NoiseSynth({
      noise: {type: "white"},
      envelope: {attack: 0.001, decay: 0.15, sustain: 0}
    }).toDestination();
    snareSynth.volume.value = -12;

    hihatSynth = new Tone.MetalSynth({
      envelope: {attack: 0.001, decay: 0.06, release: 0.01},
      harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.2

// Plays AT a precise, pre-scheduled audio time (not "now") -- this is what
// keeps it sample-accurate rather than subject to JS timer jitter. Reads
// straight from the active (possibly customized) pattern each call rather
// than a precomputed cache, so an edit made in the rhythm editor is heard
// immediately -- the cost is trivial at one lookup per sixteenth note.
function playDrumStepAt(stepIndex, time) {
  ensureDrumSynths();
  var pattern = activeBeatPattern(state.drumBeat, state.customBeatPatterns);
  if (!pattern) return;
  var step = stepIndex % 16;
  if (patternHasHitAtStep(laneByVoice(pattern, "kick"), step, 4)) kickSynth.triggerAttackRelease("C1", 0.2, time);
  if (patternHasHitAtStep(laneByVoice(pattern, "snare"), step, 4)) snareSynth.triggerAttackRelease(0.15, time);
  if (patternHasHitAtStep(laneByVoice(pattern, "hihat"), step, 4)) hihatSynth.triggerAttackRelease("16n", time);
}

// Shared by sequence playback, tap-hold preview, and setting-change preview,
// so all three treat bass identically. Returns null if bass is Off for this
// block. Applies tone selection (incl. Random), octave offset, and wraps
// into the configured one-octave register.
// Builds the ordered note sequence an arpeggiator cycles through for a given
// chord: the chord's own tones, expanded across the configured octave
// range, then reordered per the chosen pattern.
function buildArpSequence(chord) {
  var base = chord.pitches.slice().sort(function (a, b) { return a - b; });
  var expanded = [];
  var octaves = state.arpOctaves || 1;
  for (var oct = 0; oct < octaves; oct++) {
    base.forEach(function (p) { expanded.push(p + oct * 12); });
  }
  if (state.arpPattern === "down") {
    expanded.reverse();
  } else if (state.arpPattern === "updown") {
    var down = expanded.slice(0, -1).reverse(); // don't repeat the top note back-to-back
    expanded = expanded.concat(down);
  } else if (state.arpPattern === "random") {
    for (var i = expanded.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = expanded[i]; expanded[i] = expanded[j]; expanded[j] = tmp;
    }
  }
  return expanded;
}



// Schedules one block's worth of the active pattern's bass lanes,
// restarting each lane's own loop at THIS block's start -- so a bassline
// outlines whichever chord is currently sounding, rather than running
// independently of the harmony the way the drum layer does. If a lane's
// pattern is longer than the block, a hit that would start after the block
// ends is simply skipped (the next block's own pass picks up from beat 0);
// if the block is longer than one loop, the lane repeats to fill it, and a
// hit that would run past the block's end is shortened rather than
// bleeding into the next chord.
function scheduleBassForBlock(chord, atOffsetSeconds, durBeats, baseTime, secondsPerBeat) {
  var pattern = activeBeatPattern(state.drumBeat, state.customBeatPatterns);
  var shift = bassOctaveShift(chord.chordRootPitch, state.bassWrapLow);
  pattern.lanes.forEach(function (lane) {
    var slot = bassSlotForVoice(lane.voice);
    if (slot < 0) return; // a drum lane, not a bass one -- handled by playDrumStepAt
    var pitch = chordTonePitch(chord, slot) + shift;
    for (var cycle = 0; cycle * pattern.loopBeats < durBeats - 0.0001; cycle++) {
      lane.hits.forEach(function (hit) {
        var startBeat = cycle * pattern.loopBeats + hit.beat;
        if (startBeat >= durBeats - 0.0001) return;
        var noteDurBeats = Math.min(hit.dur, durBeats - startBeat);
        var noteDurSeconds = noteDurBeats * secondsPerBeat;
        Tone.Transport.scheduleOnce(function (time) {
          bassSynth.triggerAttackRelease(midiToFreq(pitch), noteDurSeconds * 0.92, time);
        }, baseTime + atOffsetSeconds + startBeat * secondsPerBeat);
      });
    }
  });
}


// The playback engine (below) deliberately operates on "playbackBlocks", NOT
// "editingBlocks" directly -- playing a single section plays editingBlocks,
// but playing the whole song plays a concatenation of every arrangement
// slot's blocks, which isn't any one section's own array.
var playbackBlocks = null;
var playbackMode = "section"; // "section" | "song" -- which UI to update as it plays

function cumulativeBeatsBeforeIndex(idx) {
  var sum = 0;
  for (var i = 0; i < idx; i++) sum += getDurationBeats(playbackBlocks[i]);
  return sum;
}

// Given a beat position measured from where playback started (startIndex),
// finds which block is sounding there and how many beats remain in it --
// used to clamp a bass note so it never bleeds past the chord that owns it.

/* ============================================================
   LAYOUT: flat block list -> measure rows (pure rendering, not data)
   ============================================================ */

var BEATS_PER_MEASURE = 4;
var MEASURES_PER_ROW = 2;
var BEATS_PER_ROW = BEATS_PER_MEASURE * MEASURES_PER_ROW;

function computeRows() {
  var rows = [];

    var dur = getDurationBeats(block);

    while (remaining > 0.0001) {

      var posInRow = segStart - rowIndex * BEATS_PER_ROW;
      var spaceInRow = BEATS_PER_ROW - posInRow;
      var segLen = Math.min(remaining, spaceInRow);
      if (!rows[rowIndex]) rows[rowIndex] = [];
      rows[rowIndex].push({
        blockIndex: blockIndex,
        posInRow: posInRow,
        segLen: segLen,
        isFirst: Math.abs(segStart - cursor) < 0.0001,
        isLast: remaining - segLen <= 0.0001
      });
      segStart += segLen;
      remaining -= segLen;
    }
    cursor += totalDur;
  });
  return rows;
}

MASTER_MODE_NAMES.forEach(function (n, i) {

function blockHSL(block) {
  var palette = PALETTES[state.palette] || PALETTES.sunset;
  // An applied chord isn't AT a degree the way a diatonic one is, but it's
  // clearly headed somewhere -- its target's hue keeps that destination
  // visible at a glance (the border marker in renderTimeline is what flags
  // it as an applied chord specifically, not this color choice).
  var isApplied = block.chordSource === "applied";
  var hue = palette.hues[isApplied ? block.appliedTargetIndex : block.degreeIndex];
  var extName = EXTENSION_NAMES[block.extensionIndex];
  var sat = Math.max(10, Math.min(96, (EXTENSION_SATURATION[extName] || 46) + palette.satBoost));
  var light = 53;
  if (block.aug) light -= 6;
  if (block.susIndex > 0) light -= 4;
  if (isApplied) light -= 8; // a touch darker -- visually distinct from a plain diatonic chord at the same hue
  light = Math.max(26, Math.min(66, light));
  return {hue: hue, sat: sat, light: light};
}

function backgroundForBlock(block) {
  var c = blockHSL(block);
  var top = "hsl(" + c.hue + "," + c.sat + "%," + Math.min(c.light + 13, 80) + "%)";
  var bottom = "hsl(" + c.hue + "," + c.sat + "%," + c.light + "%)";
  return "linear-gradient(180deg, " + top + ", " + bottom + ")";
}

function renderTimeline() {
  rootSelect.value = state.masterRootIndex;
  masterModeSelect.value = state.masterModeIndex;

  var rows = computeRows();
  timeline.innerHTML = "";

  // A lesson's intro and reveal flow as the FIRST content inside the same
  // scrollable area as the blocks themselves -- not a separate fixed panel
  // above it. Rebuilt on every render since timeline.innerHTML just got
  // cleared; updateLessonReveal() (called right after this from refresh())
  // fills the reveal text in on the fresh element.
  if (editingRef && editingRef.kind === "scratch") {
    var lesson = findLesson(sandbox.lessonId);
    if (lesson) {
      var introEl = document.createElement("div");
      introEl.className = "lesson-intro";
      introEl.textContent = lesson.intro;
      timeline.appendChild(introEl);
      var revealEl = document.createElement("div");
      revealEl.className = "lesson-reveal";
      revealEl.id = "lessonReveal";
      timeline.appendChild(revealEl);
    }
  }

  if (!rows.length) {
    var empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "No blocks yet -- tap + Add to start.";

  }

  rows.forEach(function (rowSegs, rowIdx) {
    var row = document.createElement("div");
    row.className = "row";

    var segWrap = document.createElement("div");
    segWrap.className = "segments";

    rowSegs.forEach(function (seg, segIdx) {
      var block = editingBlocks[seg.blockIndex];
      var chord = buildChord(block, state.masterRootIndex, state.masterModeIndex);
      var el = document.createElement("div");
      el.className = "seg";
      el.dataset.blockIndex = seg.blockIndex;
      var widthPct = (seg.segLen / BEATS_PER_ROW * 100) + "%";
      el.style.flex = "0 0 " + widthPct; // explicit no-grow/no-shrink, exact duration-proportional width
      el.style.background = backgroundForBlock(block);
      if (seg.blockIndex === state.currentIndex) el.classList.add("selected");
      if (playback.active && seg.blockIndex === playback.currentlySounding) el.classList.add("sounding");
      // Only show a dividing line where this segment ends AND a different
      // block actually follows it (not just because a measure ends here).
      if (seg.isLast && segIdx !== rowSegs.length - 1) el.classList.add("block-boundary");

      var radiusLeft = seg.isFirst ? "8px" : "0px";
      var radiusRight = seg.isLast ? "8px" : "0px";
      el.style.borderRadius = radiusLeft + " " + radiusRight + " " + radiusRight + " " + radiusLeft;

      if (block.chordSource === "applied") el.classList.add("applied-chord");

        el.appendChild(sym);
      }

      var held = false;
      el.addEventListener("pointerdown", function (e) {
        e.preventDefault();

        el.setPointerCapture(e.pointerId); // keeps pointerup/cancel targeted at THIS segment even if
          // the finger drifts elsewhere during the hold (segments allow pan-y for scrolling, so a
          // touch that turns into a scroll can otherwise hand its remaining events to a different
          // element, or none at all -- leaving this element's own "held" flag stuck true forever,
          // and its note sounding with no release ever reaching it).
        // Select + update the editor WITHOUT rebuilding the timeline DOM --
        // rebuilding here would destroy the very element still being pressed,
        // which is what caused the sound to never receive a release event.
        state.currentIndex = seg.blockIndex;
        save();
        renderEditor();
        document.querySelectorAll(".seg.selected").forEach(function (s) { s.classList.remove("selected"); });

        el.classList.add("sounding");

        }
      };
      el.addEventListener("pointerup", release);
      el.addEventListener("pointerleave", release);
      el.addEventListener("pointercancel", release);

    });

    timeline.appendChild(row);
  });
}

//
// Snapping uses HYSTERESIS, not a fixed midpoint: the decision is how far
// you've dragged from wherever you STARTED, not where you end up relative

}

  // pointer drag pans/scrolls natively -- collapsed, the shelf has nothing

  // restore the instant it happened. "Return to where you were" and "keep
  // the selected block visible" are different goals that can conflict, and
  // right after an explicit restore, the restore is the one that should win.

  // tick with a stale value of editorExpanded).

function scrollSelectedBlockIntoView() {

  if (!selected) return;

  // (below) doesn't mistake it for a genuine user scroll and invalidate the
  // saved pre-expand position because of a nudge we caused ourselves. The
  // scroll triggered by this is animated (behavior:"smooth"), so the guard
  // needs to outlast that animation, not just this one synchronous call.

  setTimeout(function () { programmaticScrollGuard = false; }, 500);
}
document.getElementById("timeline").addEventListener("scroll", function () {
  logAudio("[SCROLL] scroll event fired, scrollTop=" + document.getElementById("timeline").scrollTop + " guard=" + programmaticScrollGuard + " expanded=" + editorExpanded);

    logAudio("[SCROLL] invalidating saved position (was " + savedTimelineScrollTop + ") due to a genuine user scroll");

// The header is different: it sits at the very TOP of the screen -- exactly
// where iOS anchors pull-to-refresh recognition (a downward drag is only
// ever "pull to refresh"; ordinary rubber-band bounce would affect both

// down doesn't" points squarely at this). The header needs its own

  grid.appendChild(fieldSelect("Mode", BLOCK_MODE_NAMES, block.blockModeIndex, function (v) { block.blockModeIndex = v; refresh(); previewCurrentBlock(); }));

  // chord.inversion is the effective (clamped) one, so a value left over from a

  grid.appendChild(fieldSelect("Inversion", chord.toneLabels, chord.inversion, function (v) { block.inversion = v; refresh(); previewCurrentBlock(); }));

  // Pitch is the bass PATTERN's job now (scale degree, not a chord tone) --
  // this is just a per-block mute.
  var bassOptions = ["Bass off", "Bass on"];
  var bassArrayIndex = block.bassToneIndex === -1 ? 0 : 1;

    block.bassToneIndex = v === 0 ? -1 : 0;

  var actions = document.createElement("div");
  actions.className = "block-actions";

  var resetBlockBtn = document.createElement("button");
  resetBlockBtn.className = "icon"; resetBlockBtn.textContent = "↺"; resetBlockBtn.title = "Reset this block to defaults";
  resetBlockBtn.addEventListener("click", function () {
    if (isEditorLocked()) return;

    refresh();
  });
  actions.appendChild(resetBlockBtn);

  var backBtn = document.createElement("button");

  backBtn.addEventListener("click", function () { moveBlock(-1); });

  var fwdBtn = document.createElement("button");

  fwdBtn.addEventListener("click", function () { moveBlock(1); });

  var delBtn = document.createElement("button");
  delBtn.className = "icon danger"; delBtn.textContent = "✕"; delBtn.title = "Delete block";
  delBtn.addEventListener("click", deleteCurrentBlock);

  actions.appendChild(backBtn); actions.appendChild(fwdBtn); actions.appendChild(delBtn);
  grid.appendChild(actions);
  editor.appendChild(grid);

  // A linked box is read-only. Tapping blocks on the timeline to hear them
  // still works; nothing here can change the content.
  var locked = isEditorLocked();
  editor.classList.toggle("locked", locked);
  if (locked) {
    editor.querySelectorAll("select, button, input").forEach(function (el) { el.disabled = true; });
  }
}

// View-aware: settings (palette, root, mode...) can now be changed from the
// song view, where there's no timeline/editor to re-render.
function refresh() {
  if (currentView === "song") { renderSongView(); save(); return; }
  renderTimeline(); renderEditor();
  if (editingRef && editingRef.kind === "scratch") updateLessonReveal();
  save();
}

function previewCurrentBlock() {
  // From the song view there's no selected block -- preview a plain default
  // chord so an instrument change is still audible.
  var block = currentView === "song" ? defaultBlock() : (editingBlocks && editingBlocks[state.currentIndex]);
  if (!block) return;
  var chord = buildChord(block, state.masterRootIndex, state.masterModeIndex);
  playPitchesTimed(chord.pitches, 0.5); // short, fixed-length preview -- not held
  var bassPitch = computeBassPitchForBlock(block, chord, activeBeatPattern(state.drumBeat, state.customBeatPatterns), state.bassWrapLow);
  if (bassPitch !== null) {
    ensureAudioReady(function () { bassSynth.triggerAttackRelease(midiToFreq(bassPitch), 0.5 * 0.92); });
  }
}

function selectBlock(i) {

function addBlock() {
  if (isEditorLocked()) return;

  editingBlocks.splice(state.currentIndex + 1, 0, copy);

function deleteCurrentBlock() {
  if (isEditorLocked()) return;
  if (editingBlocks.length <= 1) return;
  editingBlocks.splice(state.currentIndex, 1);
  if (state.currentIndex >= editingBlocks.length) state.currentIndex = editingBlocks.length - 1;

  var tmp = editingBlocks[i]; editingBlocks[i] = editingBlocks[j]; editingBlocks[j] = tmp;
