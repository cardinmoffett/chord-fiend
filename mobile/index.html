/* ============================================================
   RHYTHM EDITOR: a 16th-note grid over the currently selected beat's own
   pattern. Kick/snare/hihat are simple on/off cells; the four bass rows
   (1/3/5/7 -- the chord's own root, 3rd-or-sus, 5th-or-augmented, and 7th)
   support tap-and-drag to set how long a note rings. Edits are written into
   state.customBeatPatterns, cloned from the built-in on first edit, so an
   un-touched beat is untouched and editing one project's "Rock" never
   affects another project's.
   ============================================================ */

function getEditablePattern(beatKey) {
  if (!state.customBeatPatterns) state.customBeatPatterns = {};
  if (!state.customBeatPatterns[beatKey]) {
    state.customBeatPatterns[beatKey] = JSON.parse(JSON.stringify(BUILTIN_BEAT_PATTERNS[beatKey] || BUILTIN_BEAT_PATTERNS.rock));
  }
  return state.customBeatPatterns[beatKey];
}

function toggleDrumHit(beatKey, voice, step) {
  var pattern = getEditablePattern(beatKey);
  var lane = laneByVoice(pattern, voice);
  if (!lane) return;
  var idx = lane.hits.findIndex(function (h) { return Math.round(h.beat * 4) === step; });
  if (idx >= 0) lane.hits.splice(idx, 1);
  else lane.hits.push({beat: step * 0.25, dur: 0.25});
  save();
}

// Places a bass note spanning [startStep, endStep] (inclusive) in one row,
// clearing anything it overlaps in ALL FOUR bass rows first -- only one
// bass row can sound at a given moment, so placing a note always wins over
// whatever was there before, in this row or any other.
function placeBassNote(beatKey, voice, startStep, endStep) {
  var pattern = getEditablePattern(beatKey);
  var beat = startStep * 0.25;
  var dur = (endStep - startStep + 1) * 0.25;
  var newStart = beat, newEnd = beat + dur;
  BASS_VOICES.forEach(function (v) {
    var lane = laneByVoice(pattern, v);
    if (!lane) return;
    lane.hits = lane.hits.filter(function (h) {
      var hStart = h.beat, hEnd = h.beat + h.dur;
      return hEnd <= newStart + 0.0001 || hStart >= newEnd - 0.0001; // keep only non-overlapping hits
    });
  });
  laneByVoice(pattern, voice).hits.push({beat: beat, dur: dur});
  laneByVoice(pattern, voice).hits.sort(function (a, b) { return a.beat - b.beat; });
  save();
}

function deleteBassNoteAt(beatKey, voice, atStep) {
  var pattern = getEditablePattern(beatKey);
  var lane = laneByVoice(pattern, voice);
  if (!lane) return;
  var idx = lane.hits.findIndex(function (h) { return Math.round(h.beat * 4) === atStep; });
  if (idx >= 0) lane.hits.splice(idx, 1);
  save();
}

function rhythmRowDefs() {
  return [
    {voice: "kick", type: "drum", label: "Kick"},
    {voice: "snare", type: "drum", label: "Snr"},
    {voice: "hihat", type: "drum", label: "Hat"},
    {voice: "__divider__", type: "divider"},
    {voice: "bass1", type: "bass", label: "1"},
    {voice: "bass3", type: "bass", label: "3"},
    {voice: "bass5", type: "bass", label: "5"},
    {voice: "bass7", type: "bass", label: "7"}
  ];
}

var rhythmDrag = null; // {beatKey, voice, startStep, endStep} while a bass-row drag is in progress

// Visual position/width of the scroll thumb, reflecting how much of the
// 16-step grid is currently off-screen -- purely a readout; the drag strip
// below handles panning itself and calls this to stay in sync.
function updateRhythmScrollThumb() {
  var grid = document.getElementById("rhythmGrid");
  var thumb = document.getElementById("rhythmScrollThumb");
  var contentW = grid.scrollWidth, visibleW = grid.clientWidth;
  if (contentW <= visibleW + 1) { thumb.style.left = "0%"; thumb.style.width = "100%"; return; }
  var pct = visibleW / contentW;
  var maxScroll = contentW - visibleW;
  var leftPct = maxScroll > 0 ? (grid.scrollLeft / maxScroll) * (1 - pct) : 0;
  thumb.style.width = (pct * 100) + "%";
  thumb.style.left = (leftPct * 100) + "%";
}

(function () {
  var track = document.getElementById("rhythmScrollTrack");
  var grid = document.getElementById("rhythmGrid");
  var dragging = false, lastX = 0;
  track.addEventListener("pointerdown", function (e) {
    dragging = true;
    lastX = e.clientX;
    track.setPointerCapture(e.pointerId);
  });
  track.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    grid.scrollLeft -= (e.clientX - lastX);
    lastX = e.clientX;
    updateRhythmScrollThumb();
  });
  track.addEventListener("pointerup", function () { dragging = false; });
  track.addEventListener("pointercancel", function () { dragging = false; });
  grid.addEventListener("scroll", updateRhythmScrollThumb);
})();

function renderRhythmEditor() {
  var beatKey = state.drumBeat;
  if (beatKey === "off") return;
  var pattern = activeBeatPattern(beatKey, state.customBeatPatterns);
  document.getElementById("rhythmEditorTitle").textContent = beatPatternLabel(beatKey);
  var grid = document.getElementById("rhythmGrid");
  grid.innerHTML = "";

  rhythmRowDefs().forEach(function (rowDef) {
    if (rowDef.type === "divider") {
      var div = document.createElement("div");
      div.className = "rhythm-divider";
      grid.appendChild(div);
      return;
    }
    var row = document.createElement("div");
    row.className = "rhythm-row";
    var label = document.createElement("div");
    label.className = "rhythm-row-label";
    label.textContent = rowDef.label;
    row.appendChild(label);

    var lane = laneByVoice(pattern, rowDef.voice);
    for (var step = 0; step < 16; step++) {
      var cell = document.createElement("div");
      cell.className = "rhythm-cell" + (step % 4 === 0 ? " beat-start" : "");
      cell.dataset.voice = rowDef.voice;
      cell.dataset.step = step;

      if (rowDef.type === "drum") {
        if (patternHasHitAtStep(lane, step, 4)) cell.classList.add("drum-active");
        cell.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          toggleDrumHit(beatKey, e.currentTarget.dataset.voice, parseInt(e.currentTarget.dataset.step, 10));
          renderRhythmEditor();
        });
      } else {
        if (lane) {
          lane.hits.forEach(function (h) {
            var startStep = Math.round(h.beat * 4);
            var endStep = startStep + Math.round(h.dur * 4) - 1;
            if (step === startStep) cell.classList.add("bass-note-start");
            else if (step > startStep && step <= endStep) cell.classList.add("bass-continuation");
          });
        }
        cell.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          startRhythmDrag(beatKey, e.currentTarget.dataset.voice, parseInt(e.currentTarget.dataset.step, 10));
        });
      }
      row.appendChild(cell);
    }
    grid.appendChild(row);
  });
  // Layout needs a frame to settle before scrollWidth/clientWidth are
  // trustworthy, especially right when the panel first becomes visible.
  requestAnimationFrame(updateRhythmScrollThumb);
}

function startRhythmDrag(beatKey, voice, step) {
  rhythmDrag = {beatKey: beatKey, voice: voice, startStep: step, endStep: step};
  updateRhythmDragPreview();
  function moveHandler(e) {
    var el = document.elementFromPoint(e.clientX, e.clientY);
    if (el && el.classList && el.classList.contains("rhythm-cell") && el.dataset.voice === rhythmDrag.voice) {
      rhythmDrag.endStep = parseInt(el.dataset.step, 10);
      updateRhythmDragPreview();
    }
  }
  function upHandler() {
    document.removeEventListener("pointermove", moveHandler);
    document.removeEventListener("pointerup", upHandler);
    commitRhythmDrag();
  }
  document.addEventListener("pointermove", moveHandler);
  document.addEventListener("pointerup", upHandler);
}

function updateRhythmDragPreview() {
  if (!rhythmDrag) return;
  var lo = Math.min(rhythmDrag.startStep, rhythmDrag.endStep);
  var hi = Math.max(rhythmDrag.startStep, rhythmDrag.endStep);
  document.querySelectorAll('#rhythmGrid .rhythm-cell[data-voice="' + rhythmDrag.voice + '"]').forEach(function (cell) {
    var step = parseInt(cell.dataset.step, 10);
    cell.classList.toggle("bass-drag-preview", step >= lo && step <= hi);
  });
}

function commitRhythmDrag() {
  if (!rhythmDrag) return;
  var d = rhythmDrag;
  rhythmDrag = null;
  var lo = Math.min(d.startStep, d.endStep);
  var hi = Math.max(d.startStep, d.endStep);
  if (lo === hi) {
    // A plain tap (no drag): remove a note that starts exactly here, else
    // add a short one -- so tapping an existing note's start deletes it.
    var pattern = activeBeatPattern(d.beatKey, state.customBeatPatterns);
    var lane = laneByVoice(pattern, d.voice);
    var exists = lane && lane.hits.some(function (h) { return Math.round(h.beat * 4) === lo; });
    if (exists) {
      deleteBassNoteAt(d.beatKey, d.voice, lo);
      renderRhythmEditor();
      return;
    }
  }
  placeBassNote(d.beatKey, d.voice, lo, hi);
  renderRhythmEditor();
}

// A self-contained preview loop -- separate from the main song-playback
// engine, against a plain I-chord in the song's own current key, so you can
// hear what you're building without leaving the editor.
var rhythmPreview = {active: false, repeatId: null, bassEventId: null};
function rhythmPreviewChord() {
  return buildChord(Object.assign(defaultBlock(), {degreeIndex: 0}), state.masterRootIndex, state.masterModeIndex);
}
function startRhythmPreview() {
  if (rhythmPreview.active) return;
  ensureAudioReady(function () {
    rhythmPreview.active = true;
    rhythmPreviewBtn.innerHTML = "&#9632;"; // stop icon
    var tempo = state.tempo || 100;
    var secondsPerBeat = 60 / tempo;
    var stepCounter = 0;
    Tone.Transport.bpm.value = tempo;
    rhythmPreview.repeatId = Tone.Transport.scheduleRepeat(function (time) {
      playDrumStepAt(stepCounter, time);
      stepCounter = (stepCounter + 1) % 16;
    }, secondsPerBeat / 4);
    var chord = rhythmPreviewChord();
    function scheduleLoop(atTime) {
      scheduleBassForBlock(chord, atTime, 4, 0, secondsPerBeat);
      rhythmPreview.bassEventId = Tone.Transport.scheduleOnce(function () {
        if (rhythmPreview.active) scheduleLoop(atTime + 4 * secondsPerBeat);
      }, atTime + 4 * secondsPerBeat - 0.1);
    }
    scheduleLoop(Tone.Transport.seconds);
    Tone.Transport.start();
  });
}
function stopRhythmPreview() {
  if (!rhythmPreview.active) return;
  rhythmPreview.active = false;
  rhythmPreviewBtn.innerHTML = "&#9654;"; // play icon
  if (rhythmPreview.repeatId !== null) { Tone.Transport.clear(rhythmPreview.repeatId); rhythmPreview.repeatId = null; }
  if (rhythmPreview.bassEventId !== null) { Tone.Transport.clear(rhythmPreview.bassEventId); rhythmPreview.bassEventId = null; }
  Tone.Transport.stop();
  Tone.Transport.cancel();
}

/* ---------- Playback ---------- */

// Playback is scheduled entirely on Tone.Transport -- ONE shared, sample-
// accurate clock for both the chords and the click track, instead of the
// old setTimeout-chain (which drifts, and drifts independently for the
// chords vs. the clicks, since they were two separate un-synced timers).
function activePlayButton() { return playbackMode === "song" ? songPlayBtn : playBtn; }

function stopPlayback() {
  logAudio("stopPlayback called, playback.active =", playback.active);
  Tone.Transport.stop();
  Tone.Transport.cancel();
  clickTrackRepeatId = null;
  if (!playback.active) return; // nothing was actually playing -- don't touch the DOM at all
  sequenceStop();
  playback.active = false;
  var btn = activePlayButton();
  btn.textContent = "▶ Play";
  btn.classList.remove("playing");
  if (playbackMode === "song") {
    songCurrentSlotIndex = null;
    renderSongView();
  } else {
    state.currentIndex = playback.startIndex;
    playback.currentlySounding = null;
    renderTimeline(); renderEditor();
  }
}

var clickTrackRepeatId = null;
var songBlockToSlotIndex = [];
var songCurrentSlotIndex = null;

// Schedules exactly one pass through the sequence (from startIndex, offset
// by baseTime on the Transport's own clock), then schedules ANOTHER call to
// itself -- looping back to playback.startIndex -- right as this pass ends,
// instead of stopping. This keeps going until stopPlayback() actually
// cancels the Transport, which is what breaks the chain.
function updatePlaybackUI(blockIndex) {
  if (playbackMode === "song") {
    songCurrentSlotIndex = songBlockToSlotIndex[blockIndex];
    renderSongView();
  } else {
    playback.currentlySounding = blockIndex;
    state.currentIndex = blockIndex;
    renderTimeline(); renderEditor();
  }
}

function scheduleOnePass(startIndex, baseTime) {
  if (!playback.active) return;
  var tempo = state.tempo || 100;
  var secondsPerBeat = 60 / tempo;
  var cursorSeconds = 0;

  for (var i = startIndex; i < playbackBlocks.length; i++) {
    var blockDurBeats = getDurationBeats(playbackBlocks[i]);
    var blockDurSeconds = blockDurBeats * secondsPerBeat;
    (function (blockIndex, atOffset, durSeconds, durBeats) {
      var block = playbackBlocks[blockIndex];
      var chord = buildChord(block, state.masterRootIndex, state.masterModeIndex);

      if (state.bassEnabled && block.bassToneIndex !== -1) {
        scheduleBassForBlock(chord, atOffset, durBeats, baseTime, secondsPerBeat);
      }

      if (state.arpEnabled) {
        // Replace the held chord with its notes cycling one at a time,
        // repeating the pattern to fill however long this block lasts.
        var arpSeq = buildArpSequence(chord);
        var arpStepSeconds = (DURATION_BEATS[DURATION_NAMES[state.arpRate]] || 0.5) * secondsPerBeat;
        var stepsInBlock = Math.max(1, Math.round(durSeconds / arpStepSeconds));
        for (var s = 0; s < stepsInBlock; s++) {
          (function (stepIdx) {
            var pitch = arpSeq[stepIdx % arpSeq.length];
            Tone.Transport.scheduleOnce(function (time) {
              synth.triggerAttackRelease([midiToFreq(pitch)], arpStepSeconds * 0.85, time);
              if (stepIdx === 0) {
                Tone.Draw.schedule(function () { updatePlaybackUI(blockIndex); }, time);
              }
            }, baseTime + atOffset + stepIdx * arpStepSeconds);
          })(s);
        }
      } else {
        Tone.Transport.scheduleOnce(function (time) {
          var freqs = chord.pitches.map(midiToFreq);
          // Releasing and re-attacking the SAME pitch at the exact same instant
          // (common when consecutive chords share a note) can leave that voice's
          // envelope stuck -- a 1ms gap (inaudible) gives it an unambiguous order.
          synth.releaseAll(time);
          synth.triggerAttack(freqs, time + 0.001);
          Tone.Draw.schedule(function () { updatePlaybackUI(blockIndex); }, time);
        }, baseTime + atOffset);
      }
    })(i, cursorSeconds, blockDurSeconds, blockDurBeats);
    cursorSeconds += blockDurSeconds;
  }

  // Restart the drum pattern fresh for this pass, so step 0 realigns with
  // "beat 1" of the loop rather than drifting if the sequence length isn't
  // an exact multiple of one measure. Runs at sixteenth-note resolution,
  // 4 steps per quarter-note beat, checking the pattern at each step.
  if (state.drumBeat && state.drumBeat !== "off") {
    if (clickTrackRepeatId !== null) { Tone.Transport.clear(clickTrackRepeatId); clickTrackRepeatId = null; }
    var stepCounter = Math.round(cumulativeBeatsBeforeIndex(startIndex) * 4) % 16;
    clickTrackRepeatId = Tone.Transport.scheduleRepeat(function (time) {
      playDrumStepAt(stepCounter, time);
      stepCounter = (stepCounter + 1) % 16;
    }, secondsPerBeat / 4, baseTime);
  }

  // Loop back to the start instead of stopping. The RECOMPUTATION is
  // triggered slightly EARLY (giving it a head start before the actual
  // audio moment, since scheduling a full pass is real synchronous JS work
  // that can otherwise run past Tone.js's lookahead window and land the
  // next pass's notes slightly late -- audible as a gap right at the loop).
  // The notes themselves are still scheduled at the exact original moment,
  // not the early trigger time, so the loop point itself stays precise.
  var passEndTime = baseTime + cursorSeconds;
  var lookaheadBuffer = 0.15;
  Tone.Transport.scheduleOnce(function () {
    scheduleOnePass(playback.startIndex, passEndTime);
  }, Math.max(baseTime, passEndTime - lookaheadBuffer));
}

function beginTransportPlayback(startIdx) {
  var tempo = state.tempo || 100;
  Tone.Transport.bpm.value = tempo;
  Tone.Transport.stop();
  Tone.Transport.cancel();
  Tone.Transport.position = 0;
  clickTrackRepeatId = null;
  // Forcibly silence anything left over from a previous session BEFORE
  // scheduling anything new -- cancel() only clears events that haven't
  // fired yet, it doesn't un-sound a note that's already sustaining.
  sequenceStop();

  playback.active = true;
  playback.startIndex = startIdx;
  var btn = activePlayButton();
  btn.textContent = "■ Stop";
  btn.classList.add("playing");

  scheduleOnePass(startIdx, 0);
  Tone.Transport.start();
}

function startPlayback() {
  ensureAudioReady(function () {
    playbackMode = "section";
    playbackBlocks = editingBlocks;
    beginTransportPlayback(state.currentIndex);
  });
}

// Plays every filled arrangement slot in order, concatenated into one
// continuous sequence -- looping back to the very start of the song once
// the last slot finishes, same looping behavior as a single section.
// Builds the flat block list for whole-song playback. Linked boxes
// contribute their section's LIVE blocks, so edits to a section are heard
// everywhere it's linked.
function buildSongPlaybackSequence() {
  var concatenated = [];
  var blockToSlot = [];
  state.songSlots.forEach(function (slot, idx) {
    if (!slot) return;
    resolveSlot(slot).blocks.forEach(function (block) {
      concatenated.push(block);
      blockToSlot.push(idx);
    });
  });
  // Start from the marked slot's own first block, if one was set (and it's
  // still actually in the arrangement) -- otherwise start from the top.
  var startBlockIndex = 0;
  if (songStartSlotIndex !== null) {
    var foundIdx = blockToSlot.indexOf(songStartSlotIndex);
    if (foundIdx >= 0) startBlockIndex = foundIdx;
  }
  return {blocks: concatenated, blockToSlot: blockToSlot, startBlockIndex: startBlockIndex};
}

function startSongPlayback() {
  var seq = buildSongPlaybackSequence();
  if (!seq.blocks.length) return; // nothing placed in the arrangement yet
  ensureAudioReady(function () {
    playbackMode = "song";
    playbackBlocks = seq.blocks;
    songBlockToSlotIndex = seq.blockToSlot;
    beginTransportPlayback(seq.startBlockIndex);
  });
}

playBtn.addEventListener("click", function () {
  if (playback.active) stopPlayback();
  else startPlayback();
});

var songPlayBtn = document.getElementById("songPlayBtn");
songPlayBtn.addEventListener("click", function () {
  if (playback.active) stopPlayback();
  else startSongPlayback();
});

/* ============================================================
   SONG VIEW: sections library + arrangement grid
   ============================================================ */

function findSectionById(id) { return state.sections.find(function (s) { return s.id === id; }); }
function findSlotById(id) { return state.songSlots.find(function (s) { return s && s.id === id; }); }

/* ============================================================
   LINKS: an arrangement box can be LINKED to the section it came from
   (it shows that section's live content, and is read-only), or INLINED
   (an independent copy that just remembers where it came from, so it can
   be relinked). Slot fields: sourceSectionId, linked.
   ============================================================ */

function withAsterisk(name) {
  return name.charAt(name.length - 1) === "*" ? name : name + "*";
}

// What a slot actually shows/plays right now. A linked slot reads straight
// from its section, so edits to the section appear everywhere it's linked.
function resolveSlot(slot) {
  if (slot.linked) {
    var src = findSectionById(slot.sourceSectionId);
    if (src) return {name: src.name, blocks: src.blocks, linked: true, source: src};
  }
  var source = slot.sourceSectionId != null ? findSectionById(slot.sourceSectionId) : null;
  return {name: slot.name, blocks: slot.blocks, linked: false, source: source || null};
}

function inlineSlot(slot) {
  var r = resolveSlot(slot);
  if (!r.linked) return;
  slot.blocks = JSON.parse(JSON.stringify(r.blocks));
  slot.name = withAsterisk(r.name);
  slot.linked = false; // sourceSectionId is kept, so Relink stays possible
  save();
}

// Destructive by design: whatever this box had is replaced by the section.
function relinkSlot(slot) {
  var src = findSectionById(slot.sourceSectionId);
  if (!src) return;
  slot.blocks = JSON.parse(JSON.stringify(src.blocks));
  slot.name = src.name;
  slot.linked = true;
  save();
}

// Safety net for saved data: a link whose section no longer exists becomes
// a plain independent copy rather than a broken reference.
function healLinks(st) {
  (st.songSlots || []).forEach(function (slot) {
    if (!slot) return;
    var src = slot.sourceSectionId != null
      ? (st.sections || []).find(function (sec) { return sec.id === slot.sourceSectionId; })
      : null;
    if (!src) {
      slot.sourceSectionId = null;
      if (slot.linked) { slot.linked = false; slot.name = withAsterisk(slot.name); }
    }
  });
}

function linkedSlotCount(sectionId) {
  return state.songSlots.filter(function (sl) { return sl && sl.linked && sl.sourceSectionId === sectionId; }).length;
}

// A linked box is read-only: its content IS the section's, so nothing in the
// editor may change it. Inline it first to edit it on its own.
function isEditorLocked() {
  if (!editingRef || editingRef.kind !== "slot") return false;
  var slot = findSlotById(editingRef.id);
  return !!(slot && resolveSlot(slot).linked);
}

function applyEditorLock() {
  var locked = isEditorLocked();
  addBtn.disabled = locked;
  addBtn.style.opacity = locked ? "0.4" : "";
}

// After inlining/relinking the box that's open in the editor.
function afterLinkChange(slot) {
  editingBlocks = resolveSlot(slot).blocks;
  if (state.currentIndex >= editingBlocks.length) state.currentIndex = 0;
  updateSectionNameButton();
  applyEditorLock();
  refresh();
}

function switchToSongView() {
  if (playback.active) stopPlayback(); // avoid leaving playback running for a view that's no longer shown
  if (preLearnMasterRootIndex !== null) {
    // Leaving Learn for good -- hand the real project's root/mode back
    // exactly as found, regardless of what any lesson set them to.
    state.masterRootIndex = preLearnMasterRootIndex;
    state.masterModeIndex = preLearnMasterModeIndex;
    preLearnMasterRootIndex = null;
    preLearnMasterModeIndex = null;
  }
  currentView = "song";
  armedSectionId = null;
  document.getElementById("songViewContainer").classList.remove("hidden-view");
  document.getElementById("sectionViewContainer").classList.add("hidden-view");
  document.getElementById("learnHomeContainer").classList.add("hidden-view");
  renderSongView();
}

function switchToSectionView() {
  if (playback.active) stopPlayback();
  currentView = "section";
  document.getElementById("songViewContainer").classList.add("hidden-view");
  document.getElementById("sectionViewContainer").classList.remove("hidden-view");
  updateSectionNameButton();
  applyEditorLock();
  refresh(); // renders the editor's content FIRST -- snapEditorPanel measures its real height, so it has to run after
  snapEditorPanel();
}

function openSectionForEditing(id) {
  var section = findSectionById(id);
  if (!section) return;
  editingRef = {kind: "section", id: id};
  editingBlocks = section.blocks;
  state.currentIndex = 0;
  switchToSectionView();
}

function openSlotForEditing(id) {
  var slot = findSlotById(id);
  if (!slot) return;
  editingRef = {kind: "slot", id: id};
  editingBlocks = resolveSlot(slot).blocks;
  state.currentIndex = 0;
  switchToSectionView();
}

function createNewSection() {
  var id = state.nextSectionId++;
  var section = {id: id, name: "Section " + id, blocks: [defaultBlock()]};
  state.sections.push(section);
  save();
  openSectionForEditing(id);
}

// Arms a section (loads the brush). Stays armed across multiple placements
// -- placeArmedSectionInto deliberately does not clear it. Tapping the SAME
// already-armed chip again opens it for editing instead (handled by the
// click listener itself, before this ever gets called with that section).
function armSection(id) {
  armedSectionId = id;
  renderSongView();
}

// Placing always makes an independent COPY -- editing an arrangement slot
// afterward never affects the section it came from, and vice versa. One
// tap loads, one tap applies AND unloads -- not a brush that stays loaded
// across multiple placements.
function placeArmedSectionInto(slotIndex) {
  var section = findSectionById(armedSectionId);
  if (!section) return;
  var existing = state.songSlots[slotIndex];
  var copy = {
    id: existing ? existing.id : state.nextSlotId++,
    name: section.name,
    blocks: JSON.parse(JSON.stringify(section.blocks)),
    sourceSectionId: section.id,
    linked: true
  };
  state.songSlots[slotIndex] = copy;
  armedSectionId = null;
  save();
  renderSongView();
}

// Tapping a filled, unarmed arrangement box marks (or un-marks, on a second
// tap) it as where whole-song Play should begin -- this ALSO doubles as the
// reveal step for that box's edit band, same two-tap pattern as sections.
function toggleSongStartSlot(slotIndex) {
  songStartSlotIndex = (songStartSlotIndex === slotIndex) ? null : slotIndex;
  renderSongView();
}

// A thin strip of each block's own color (same hue-from-degree, saturation-
// from-extension logic the timeline itself uses), proportional to duration
// -- a real at-a-glance preview of a section/slot's content, not just a name.
function chipColorStrip(blocks) {
  var strip = document.createElement("div");
  strip.className = "chip-color-strip";
  if (!blocks || !blocks.length) return strip;
  var totalBeats = blocks.reduce(function (sum, b) { return sum + getDurationBeats(b); }, 0) || 1;
  blocks.forEach(function (block) {
    var seg = document.createElement("div");
    var pct = (getDurationBeats(block) / totalBeats) * 100;
    seg.style.flexBasis = pct + "%";
    var c = blockHSL(block);
    seg.style.background = "hsl(" + c.hue + "," + c.sat + "%," + c.light + "%)";
    strip.appendChild(seg);
  });
  return strip;
}

// Shared by both grids: builds the color-strip preview and name content of
// a filled chip, plus its status label when one applies. No icon is ever
// shown until that first tap -- this is the whole two-tap pattern.
function fillChipContent(chip, item, showLink) {
  chip.appendChild(chipColorStrip(item.blocks));

  // Indicator only -- not a tap target (pointer-events: none in CSS).
  if (showLink) {
    var linkIcon = document.createElement("div");
    linkIcon.className = "chip-link-icon";
    linkIcon.textContent = "\uD83D\uDD17";
    chip.appendChild(linkIcon);
  }

  var nameEl = document.createElement("div");
  nameEl.className = "chip-name";
  nameEl.textContent = item.name;
  chip.appendChild(nameEl);
}

// Generic tap-vs-long-press detector, reused for both grids. A long press
// suppresses the subsequent tap action entirely (it's one gesture or the
// other, never both).
// Shared across EVERY chip, deliberately not a per-element closure: onTap
// commonly triggers a re-render (renderSongView() tears down and rebuilds
// the whole chip grid), which would destroy a per-element timer before the
// second tap ever arrives. tapKey identifies "this same logical chip"
// across that rebuild, even though it's now a different DOM node.
var lastTapInfo = null; // {key, time}

// onDoubleTap and tapKey are optional together. A double-tap still fires
// onTap once for the first tap (there's no way to know a second is coming
// without delaying every single tap, which would make normal taps feel
// laggy) -- call sites using onDoubleTap for "open to edit" are fine with
// that, since navigating away makes whatever the first tap did moot.
function attachTapAndHold(el, onTap, onLongPress, onDoubleTap, tapKey) {
  var pressTimer = null;
  var longPressFired = false;
  var DOUBLE_TAP_WINDOW_MS = 350;
  el.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    longPressFired = false;
    pressTimer = setTimeout(function () { longPressFired = true; onLongPress(); }, 500);
  });
  function cancelTimer() { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } }
  el.addEventListener("pointerup", function () {
    cancelTimer();
    if (longPressFired) return;
    var now = Date.now();
    if (onDoubleTap && tapKey != null && lastTapInfo && lastTapInfo.key === tapKey && now - lastTapInfo.time < DOUBLE_TAP_WINDOW_MS) {
      lastTapInfo = null; // reset so a third quick tap doesn't chain into another double-tap
      onDoubleTap();
      return;
    }
    lastTapInfo = tapKey != null ? {key: tapKey, time: now} : null;
    onTap();
  });
  el.addEventListener("pointerleave", cancelTimer);
  el.addEventListener("pointercancel", cancelTimer);
}

function currentEditingItem() {

  return editingRef.kind === "section" ? findSectionById(editingRef.id) : findSlotById(editingRef.id);
}

// The header pill's text: a linked box shows its section's name plus a link icon.
function sectionNameText() {

  if (editingRef.kind === "slot") {
    var r = resolveSlot(item);
    return (r.linked ? "\uD83D\uDD17 " : "") + r.name;

}

function setEditingName(name) {

  var r = editingRef.kind === "slot" ? resolveSlot(item) : null;
  if (r && r.linked) r.source.name = name;
  else item.name = name;

}

function openNamePicker() {

  var customBtn = document.createElement("button");

    if (v) { setEditingName(v); closeFlyout(); }
  });
  flyoutPanel.appendChild(customBtn);

  // Link controls, only for arrangement boxes that have (or had) a source.
  if (editingRef && editingRef.kind === "slot") {
    var linkSlot = findSlotById(editingRef.id);
    var linkInfo = linkSlot ? resolveSlot(linkSlot) : null;
    if (linkInfo && (linkInfo.linked || linkInfo.source)) {

      flyoutPanel.appendChild(divider);
      var linkBtn = document.createElement("button");
      linkBtn.className = "pill";
      linkBtn.style.width = "100%";
      if (linkInfo.linked) {
        linkBtn.textContent = "\uD83D\uDD17 Inline";
        linkBtn.addEventListener("click", function () {
          inlineSlot(linkSlot); afterLinkChange(linkSlot); closeFlyout();
        });
      } else {
        linkBtn.textContent = "\uD83D\uDD17 Relink\u2026";
        linkBtn.addEventListener("click", function () { openRelinkConfirm(linkSlot); });
      }
      flyoutPanel.appendChild(linkBtn);
    }
  }

  flyoutBackdrop.classList.add("open");
}

function openRelinkConfirm(slot) {
  var src = findSectionById(slot.sourceSectionId);
  if (!src) return;
  ensureFlyoutDom();
  flyoutPanel.innerHTML = "";
  flyoutTitle("Relink to \u201C" + src.name + "\u201D?");
  var note = document.createElement("div");
  note.style.fontSize = "12px";
  note.style.color = "var(--text-dim)";
  note.textContent = "This box\u2019s own edits will be replaced by the section\u2019s content.";
  flyoutPanel.appendChild(note);
  flyoutButton("Relink", function () { relinkSlot(slot); afterLinkChange(slot); closeFlyout(); });
  flyoutButton("Cancel", closeFlyout);
  showFlyoutPanel();
}

/* ---------- Projects: create / open / rename / duplicate / delete ---------- */

var flyoutOpenedAt = 0;
// Ignores the tail end of the very press that opened a menu, so releasing a
// long-press can't accidentally trigger whichever button is now under the finger.
function guardedFlyoutClick(btn, fn) {
  btn.addEventListener("click", function () {
    if (Date.now() - flyoutOpenedAt < 300) return;
    fn();
  });
}
function showFlyoutPanel() {
  flyoutOpenedAt = Date.now();
  flyoutBackdrop.classList.add("open");
}
function flyoutTitle(text) {
  var h = document.createElement("h2");
  h.textContent = text;
  h.style.overflow = "hidden";
  h.style.textOverflow = "ellipsis";
  h.style.whiteSpace = "nowrap";
  flyoutPanel.appendChild(h);
}
function flyoutButton(label, fn) {
  var b = document.createElement("button");
  b.className = "pill";
  b.style.width = "100%";
  b.textContent = label;
  guardedFlyoutClick(b, fn);
  flyoutPanel.appendChild(b);
  return b;
}

function updateProjectNameButton() {
  var p = activeProject();
  var btn = document.getElementById("projectNameBtn");
  if (btn && p) btn.textContent = p.name + " \u25BE";
}

// Sound settings live in the project now, so switching projects has to push
// the new project's instrument and effect levels into the live audio nodes.
function applyStateToAudio() {
  if (!toneReady) return;
  rebuildSynth();
  if (bassSynth) bassSynth.volume.value = state.bassVolume;
  if (masterReverb) {
    masterReverb.wet.value = state.reverbWet;
    if (masterReverb.decay !== state.reverbDecay) masterReverb.decay = state.reverbDecay;
  }
  if (masterDelay) {
    masterDelay.wet.value = state.delayWet;
    masterDelay.feedback.value = state.delayFeedback;
    masterDelay.delayTime.value = delayTimeSeconds();
  }
}

function switchToProject(id) {
  var target = projectsStore.projects.find(function (p) { return p.id === id; });
  if (!target) return;
  if (playback.active) stopPlayback();
  save(); // persist the project we're leaving
  projectsStore.activeId = id;
  target.data = Object.assign(freshState(), target.data);
  state = target.data;
  state.palette = projectsStore.palette;
  healLinks(state);
  editingRef = null; editingBlocks = null; playbackBlocks = null;
  armedSectionId = null; songStartSlotIndex = null; songCurrentSlotIndex = null;
  applyStateToAudio();
  save();
  switchToSongView();
}

function createProject() {
  var id = projectsStore.nextProjectId++;
  projectsStore.projects.push({id: id, name: generateProjectName(), data: freshState()});
  switchToProject(id);
}

function duplicateProject(id) {
  var idx = projectsStore.projects.findIndex(function (p) { return p.id === id; });
  if (idx < 0) return;
  var original = projectsStore.projects[idx];
  var copy = {
    id: projectsStore.nextProjectId++,
    name: uniqueProjectName(original.name + " copy"),
    data: JSON.parse(JSON.stringify(original.data))
  };
  projectsStore.projects.splice(idx + 1, 0, copy);
  save();
  return copy.id;
}

function renameProject(id, name) {
  var p = projectsStore.projects.find(function (x) { return x.id === id; });
  if (!p || !name) return;
  p.name = name;
  save();
  updateProjectNameButton();
}

// Deleting the last remaining project leaves a fresh blank one rather than
// an empty app; deleting the open one moves to a neighbor.
function deleteProject(id) {
  var idx = projectsStore.projects.findIndex(function (p) { return p.id === id; });
  if (idx < 0) return;
  var wasActive = id === projectsStore.activeId;
  projectsStore.projects.splice(idx, 1);
  if (!projectsStore.projects.length) {
    var nid = projectsStore.nextProjectId++;
    projectsStore.projects.push({id: nid, name: generateProjectName(), data: freshState()});
    switchToProject(nid);
    return;
  }
  if (wasActive) {
    switchToProject(projectsStore.projects[Math.min(idx, projectsStore.projects.length - 1)].id);
    return;
  }
  save();
}

function flyoutSectionLabel(text) {
  var d = document.createElement("div");
  d.textContent = text;
  d.style.cssText = "font-size:11px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:var(--text-faint);margin-top:6px;padding-top:10px;border-top:1px solid var(--line-soft);";
  flyoutPanel.appendChild(d);
}

// The "file menu": everything is a plain, visible item. Rename / Duplicate /
// Delete act on the project that's open (like File > Save As in a DAW);
// the list underneath is for opening a different one.
function openFileMenu() {
  ensureFlyoutDom();
  flyoutPanel.innerHTML = "";
  var p = activeProject();
  flyoutTitle(p.name);
  flyoutButton("Rename\u2026", function () { openRenameProject(p); });
  flyoutButton("Duplicate", function () {
    var newId = duplicateProject(p.id); // like "Save As": you land in the copy
    closeFlyout();
    switchToProject(newId);
  });
  flyoutButton("Delete\u2026", function () { openDeleteProjectConfirm(p); });

  flyoutSectionLabel("Projects");
  flyoutButton("New project", function () { closeFlyout(); createProject(); });
  projectsStore.projects.forEach(function (other) {
    if (other.id === p.id) return;
    var b = flyoutButton(other.name, function () { closeFlyout(); switchToProject(other.id); });
    b.style.overflow = "hidden";
    b.style.textOverflow = "ellipsis";
    b.style.whiteSpace = "nowrap";
  });
  showFlyoutPanel();
}

function openRenameProject(p) {
  ensureFlyoutDom();
  flyoutPanel.innerHTML = "";
  flyoutTitle("Rename");
  var input = document.createElement("input");
  input.type = "text";
  input.value = p.name;
  input.style.width = "100%";
  flyoutPanel.appendChild(input);
  function commit() {
    var v = input.value.trim();
    if (v) renameProject(p.id, v);
    openFileMenu();
  }
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") commit(); });
  flyoutButton("Suggest a name", function () { input.value = generateProjectName(); });
  flyoutButton("Save", commit);
  flyoutButton("Cancel", openFileMenu);
  showFlyoutPanel();
  setTimeout(function () { if (input.focus) { input.focus(); input.select(); } }, 50);
}

function openDeleteProjectConfirm(p) {
  ensureFlyoutDom();
  flyoutPanel.innerHTML = "";
  flyoutTitle("Delete \u201C" + p.name + "\u201D?");
  var note = document.createElement("div");
  note.style.fontSize = "12px";
  note.style.color = "var(--text-dim)";
  note.textContent = projectsStore.projects.length > 1
    ? "This can\u2019t be undone."
    : "This can\u2019t be undone. It\u2019s your only project, so a new blank one will take its place.";
  flyoutPanel.appendChild(note);
  flyoutButton("Delete", function () {
    deleteProject(p.id); // always the open project, so this always lands you somewhere else
    closeFlyout();
  });
  flyoutButton("Cancel", openFileMenu);
  showFlyoutPanel();
}

// Edit lives on double-tap now, not here -- this menu is for the actions
// that don't have their own gesture.
function openSectionFlyout(section) {
  openFlyout(section.name, [
    {label: "Duplicate", run: function () { duplicateSection(section.id); }},
    {label: "Insert new after", run: function () { insertSectionAfter(section.id); }},
    {label: "Delete", run: function () { requestDeleteSection(section); }}
  ]);
}

// Edit lives on double-tap now, not here -- this menu is for the actions
// that don't have their own gesture.
function openSlotFlyout(slot) {
  openFlyout(resolveSlot(slot).name, [
    {label: "Duplicate", run: function () { duplicateSlot(slot.id); }},
    {label: "Insert empty after", run: function () { insertEmptySlotAfter(slot.id); }},
    {label: "Delete", run: function () { deleteSlotById(slot.id); }}
  ]);
}

/* ---------- Duplicate / Insert / Delete for sections and arrangement slots ---------- */

function duplicateSection(id) {
  var idx = state.sections.findIndex(function (s) { return s.id === id; });
  if (idx < 0) return;
  var original = state.sections[idx];
  var copy = {id: state.nextSectionId++, name: original.name + " copy", blocks: JSON.parse(JSON.stringify(original.blocks))};
  state.sections.splice(idx + 1, 0, copy);
  save(); renderSongView();
}
function insertSectionAfter(id) {
  var idx = state.sections.findIndex(function (s) { return s.id === id; });
  if (idx < 0) return;
  var id2 = state.nextSectionId++;
  var section = {id: id2, name: "Section " + id2, blocks: [defaultBlock()]};
  state.sections.splice(idx + 1, 0, section);
  save();
  openSectionForEditing(id2);
}
function deleteSection(id) {
  var idx = state.sections.findIndex(function (s) { return s.id === id; });
  if (idx < 0) return;
  var section = state.sections[idx];
  // Boxes linked to it keep their content and become independent copies;
  // nothing is left pointing at a section that no longer exists.
  state.songSlots.forEach(function (sl) {
    if (!sl || sl.sourceSectionId !== id) return;
    if (sl.linked) {
      sl.blocks = JSON.parse(JSON.stringify(section.blocks));
      sl.name = withAsterisk(section.name);
      sl.linked = false;
    }
    sl.sourceSectionId = null; // nothing left to relink to
  });
  state.sections.splice(idx, 1);
  if (armedSectionId === id) armedSectionId = null;
  save(); renderSongView();
}

// Only asks for confirmation when it actually affects something else.
function requestDeleteSection(section) {
  var n = linkedSlotCount(section.id);
  if (n === 0) { deleteSection(section.id); return; }
  ensureFlyoutDom();
  flyoutPanel.innerHTML = "";
  flyoutTitle("Delete \u201C" + section.name + "\u201D?");
  var note = document.createElement("div");
  note.style.fontSize = "12px";
  note.style.color = "var(--text-dim)";
  note.textContent = n + (n === 1 ? " arrangement box is" : " arrangement boxes are") +
    " linked to it and will become independent copies.";
  flyoutPanel.appendChild(note);
  flyoutButton("Delete", function () { closeFlyout(); deleteSection(section.id); });
  flyoutButton("Cancel", closeFlyout);
  showFlyoutPanel();
}

function duplicateSlot(id) {
  var idx = state.songSlots.findIndex(function (s) { return s && s.id === id; });
  if (idx < 0) return;
  var original = state.songSlots[idx];
  var r = resolveSlot(original);
  var copy = {
    id: state.nextSlotId++, name: original.name,
    blocks: JSON.parse(JSON.stringify(r.blocks)),
    sourceSectionId: original.sourceSectionId != null ? original.sourceSectionId : null,
    linked: r.linked // a copy of a linked box is linked to the same section
  };
  state.songSlots.splice(idx + 1, 0, copy);
  save(); renderSongView();
}
function insertEmptySlotAfter(id) {
  var idx = state.songSlots.findIndex(function (s) { return s && s.id === id; });
  if (idx < 0) return;
  state.songSlots.splice(idx + 1, 0, null);
  save(); renderSongView();
}
function deleteSlotById(id) {
  var idx = state.songSlots.findIndex(function (s) { return s && s.id === id; });
  if (idx < 0) return;
  state.songSlots.splice(idx, 1);
  songStartSlotIndex = null; // indices have shifted -- simplest to just clear it
  save(); renderSongView();
}

function renderSongView() {
  updateProjectNameButton();
  var arrangementGrid = document.getElementById("arrangementGrid");
  var paletteGrid = document.getElementById("sectionPaletteGrid");
  arrangementGrid.innerHTML = "";
  paletteGrid.innerHTML = "";

  // Always show one empty slot at the end of the arrangement to grow into.
  var slotsToRender = state.songSlots.length + 1;
  for (var i = 0; i < slotsToRender; i++) {
    (function (slotIndex) {
      var slot = state.songSlots[slotIndex];
      var chip = document.createElement("div");
      var isSounding = playback.active && playbackMode === "song" && songCurrentSlotIndex === slotIndex;
      var isStart = songStartSlotIndex === slotIndex;
      chip.className = "chip " + (slot ? "filled" : "empty") +
        (isSounding ? " sounding" : "") + (isStart ? " armed" : "");

      if (slot) {
        var rs = resolveSlot(slot);
        fillChipContent(chip, {name: rs.name, blocks: rs.blocks}, rs.linked);
      }
      else {
        var plus = document.createElement("div");
        plus.className = "chip-plus";
        plus.textContent = "+";
        chip.appendChild(plus);
      }

      attachTapAndHold(chip,
        function onTap() {
          if (armedSectionId !== null) {
            placeArmedSectionInto(slotIndex); // a section is loaded -- apply it here, then unload
          } else if (slot) {
            toggleSongStartSlot(slotIndex); // mark/un-mark as the song-play start point
          }
          // An empty slot tapped with nothing loaded does nothing.
        },
        function onLongPress() {
          if (armedSectionId !== null || !slot) return; // no menu on an empty box, or while something's loaded
          openSlotFlyout(slot);
        },
        function onDoubleTap() {
          if (armedSectionId !== null || !slot) return; // nothing to edit on an empty box, or while something's loaded
          openSlotForEditing(slot.id);
        },
        "slot-" + slotIndex
      );
      arrangementGrid.appendChild(chip);
    })(i);
  }

  // Normal left-to-right order: item 1 first, then each subsequent section,
  // with "+" appended last so it always sits at the far right.
  state.sections.forEach(function (section) {
    var chip = document.createElement("div");
    var isArmed = armedSectionId === section.id;
    chip.className = "chip filled" + (isArmed ? " armed" : "");
    fillChipContent(chip, section);

    attachTapAndHold(chip,
      function onTap() {
        armedSectionId = isArmed ? null : section.id; // tap the same loaded one again to unload
        renderSongView();
      },
      function onLongPress() {
        if (armedSectionId !== null) return; // long-press only matters when nothing's loaded
        openSectionFlyout(section);
      },
      function onDoubleTap() {
        // The first tap of this very double-tap already armed THIS section
        // (that's just what a single tap on it does) -- only bail if some
        // OTHER section was armed before the gesture began.
        if (armedSectionId !== null && armedSectionId !== section.id) return;
        openSectionForEditing(section.id);
      },
      "section-" + section.id
    );
    paletteGrid.appendChild(chip);
  });

  var addChip = document.createElement("div");
  addChip.className = "chip empty";
  var plus2 = document.createElement("div");
  plus2.className = "chip-plus";
  plus2.textContent = "+";
  addChip.appendChild(plus2);
  addChip.addEventListener("click", createNewSection);
  paletteGrid.appendChild(addChip);
}

document.getElementById("backToSongBtn").addEventListener("click", function () {
  if (editingRef && editingRef.kind === "scratch") switchToLearnHome();
  else switchToSongView();
});
document.getElementById("sectionNameBtn").addEventListener("click", openNamePicker);
document.getElementById("projectNameBtn").addEventListener("click", openFileMenu);

// Tapping empty background (not any chip) clears whatever's currently
// selected -- an armed section you decided not to place after all, or a
// marked start point you want to clear. Checking e.target === songMain
// (rather than needing stopPropagation on every chip) is what distinguishes
// "the background itself was tapped" from "a child chip was tapped."
var songMain = document.getElementById("songMain");
songMain.addEventListener("click", function (e) {
  // Only counts as "background" if the tap landed on songMain itself or one
  // of the grid containers directly -- not on a chip (or its label) inside them.
  if (e.target !== songMain && e.target.id !== "arrangementGrid" && e.target.id !== "sectionPaletteGrid") return;
  if (armedSectionId !== null || songStartSlotIndex !== null) {
    armedSectionId = null;
    songStartSlotIndex = null;
    renderSongView();
  }
});

/* ============================================================
   LEARN: a companion space for building real hearing and vocabulary,
   using the SAME chord engine, timeline, and block editor as the song
   builder -- not a separate rendering path. A lesson loads a starting
   example into the sandbox; you explore it with the real controls
   (including Applied chords); the app recognizes and names whatever
   progression you've actually landed on.

   Progress (which lessons you've found something in) is a property of the
   person, not any one project -- it lives on projectsStore, saved by the
   same save() that already persists the whole store.
   ============================================================ */

function learnBlock(overrides) {
  return Object.assign(defaultBlock(), overrides || {});
}

// Recognizes a handful of named shapes from a plain (Thru-mode, untouched
// extension, diatonic) degree sequence -- the vocabulary Unit 1 teaches.
// Matches the LAST TWO chords as a cadence first (so changing just the
// final chord in a lesson's example is enough to discover a different
// cadence), then checks the WHOLE sequence for a larger recognized shape.
// Later units extend this same table rather than needing their own UI.
var CADENCE_LIBRARY = [
  {pair: [4,0], name: "Authentic Cadence", reveal: "V\u2013I \u2014 full resolution, the strongest possible landing."},
  {pair: [3,0], name: "Plagal Cadence", reveal: "IV\u2013I \u2014 the \u201cAmen\u201d cadence \u2014 softer, more spacious."},
  {pair: [0,4], name: "Half Cadence", reveal: "I\u2013V \u2014 ending ON the dominant, deliberately left open."},
  {pair: [4,5], name: "Deceptive Cadence", reveal: "V\u2013vi \u2014 the resolution you expected, redirected somewhere else."}
];
// requireMasterMode: a "plain:N" signature means something entirely
// different depending on the home mode (degree 6 is a diminished vii° in
// Ionian, but a major bVII in Mixolydian) -- any entry whose identity
// depends on that distinction must pin the master mode it was verified
// against, or it can silently match an unrelated lesson in a different
// mode that happens to share the same bare degree sequence.
var PROGRESSION_LIBRARY = [
  {seq: ["plain:0","plain:3","plain:4","plain:0"], requireMasterMode: "Ionian", name: "I\u2013IV\u2013V\u2013I", reveal: "The plainest possible cadence vocabulary \u2014 home, away, tension, home."},
  {seq: ["plain:0","plain:5","plain:3","plain:4"], requireMasterMode: "Ionian", name: "The 50s Progression (I\u2013vi\u2013IV\u2013V)", reveal: "Also called the doo-wop progression or the \u201cHeart and Soul\u201d chords \u2014 the sound of doo-wop and early rock and roll, still turning up in hits today."},
  {seq: ["plain:0","plain:4","plain:5","plain:3"], requireMasterMode: "Ionian", name: "The Axis Progression (I\u2013V\u2013vi\u2013IV)", reveal: "Named after a 2009 comedy routine stitching dozens of hits together over these same four chords \u2014 the single most common loop in pop and rock since the 1960s."},
  {seq: ["plain:5","plain:3","plain:0","plain:4"], requireMasterMode: "Ionian", name: "The Axis, Rotated (vi\u2013IV\u2013I\u2013V)", reveal: "The exact same four chords as the Axis progression, just starting from a different point in the loop \u2014 sometimes called the \u201csensitive female\u201d progression for its frequent use in confessional singer-songwriter ballads."},
  {seq: ["plain:0","plain:4","plain:5","plain:2","plain:3","plain:0","plain:3","plain:4"], requireMasterMode: "Ionian", name: "Pachelbel's Canon", reveal: "The bassline of Johann Pachelbel's Canon in D (circa 1680) \u2014 one of the most reused progressions in Western music, surfacing in pop songs across every decade since."},
  {seq: ["plain:0","plain:6","plain:5","applied:0:dominant"], requireMasterMode: "Aeolian", name: "The Andalusian Cadence", reveal: "A descending bass line found throughout flamenco, classical music, and rock \u2014 the final chord needs a genuinely raised leading tone to pull convincingly back home."},
  {seq: ["plain:0","plain:6","plain:3","plain:0"], requireMasterMode: "Mixolydian", name: "The Mixolydian Rock Riff (I\u2013\u266DVII\u2013IV)", reveal: "The backbone of countless classic rock riffs \u2014 every chord here is plain and unaltered, straight from Mixolydian's own notes."},
  {seq: ["plain:0","plain:3","plain:0","plain:3"], requireMasterMode: "Dorian", name: "The Dorian Vamp (i\u2013IV)", reveal: "A two-chord loop that doesn't need to go anywhere \u2014 the backbone of modal jazz and a lot of folk and funk."},
  {seq: ["plain:0","plain:0","plain:0","plain:0","plain:3","plain:3","plain:0","plain:0","plain:4","plain:3","plain:0","plain:4"], requireMasterMode: "Ionian", name: "The 12-Bar Blues", reveal: "Twelve bars, three chords, and more recorded songs built on it than any other single pattern in Western popular music."},
  {seq: ["plain:5","plain:1","plain:4","plain:0"], requireMasterMode: "Ionian", name: "The Circle Progression (vi\u2013ii\u2013V\u2013I)", reveal: "Each root drops a perfect fifth into the next \u2014 walking straight down the circle of fifths into a real resolution, a jazz and pop staple alike."},
  {seq: ["plain:0","plain:5","plain:1","plain:4"], requireMasterMode: "Ionian", name: "I\u2013vi\u2013ii\u2013V (Jazz Turnaround)", reveal: "The 50s progression's jazzier cousin \u2014 ii substitutes for IV, turning a doo-wop loop into the turnaround that ends a thousand jazz standards."},
  {seq: ["plain:3","plain:4","plain:2","plain:5"], requireMasterMode: "Ionian", name: "The Royal Road Progression (IV\u2013V\u2013iii\u2013vi)", reveal: "Never touches the tonic \u2014 behind an estimated 40% of Japan's best-selling singles, from city pop to anime openings."},
  {seq: ["plain:0","plain:5","plain:2","plain:6"], requireMasterMode: "Aeolian", name: "The Minor Epic Loop (i\u2013VI\u2013III\u2013VII)", reveal: "The exact same four chords as the Axis and 50s progressions \u2014 just starting from the minor chord instead of the major one, which is all it takes to turn bright pop into cinematic, driving rock."},
  {seq: ["plain:1","borrow:6:Aeolian:2","plain:0"], requireMasterMode: "Ionian", name: "The Backdoor Progression", reveal: "ii leading into a genuine Backdoor Dominant, then home \u2014 the full progression behind that softer, gospel-and-soul route to the tonic."},
  {seq: ["plain:1","applied:0:dominant","plain:0"], requireMasterMode: "Aeolian", name: "The Minor ii\u00b0\u2013V\u2013i", reveal: "Minor's own version of the most common cadence in jazz \u2014 a diminished ii\u00b0 leading into a properly raised V, landing home."},
  {seq: ["plain:0","plain:1","plain:0","plain:1"], requireMasterMode: "Phrygian", name: "The Phrygian Vamp (i\u2013\u266DII)", reveal: "A half-step oscillation between the tonic and the note right above it \u2014 flamenco's and metal's shared harmonic fingerprint."}
];
// A signature for ANY block (plain, borrowed, or applied) that never returns
// null -- unlike plainDegreeSeq below (which exists specifically to detect
// "every block here is plain," for cadence-matching purposes), this lets
// PROGRESSION_LIBRARY recognize named progressions that include a borrowed
// or applied chord, like a Mixolydian riff's bVII or a minor cadence's
// raised V -- real, famous progressions that are never ALL plain chords.
function blockSignature(b) {
  if (b.chordSource === "applied") return "applied:" + b.appliedTargetIndex + ":" + b.appliedFunction;
  // Extension is part of a borrowed chord's identity when a progression's
  // name depends on it -- e.g. the Backdoor Progression's bVII needs its
  // 7th to be the actual backdoor-dominant sound; a plain borrowed triad
  // there is a different, weaker thing and shouldn't match the same entry.
  if (b.blockModeIndex !== 0) return "borrow:" + b.degreeIndex + ":" + BLOCK_MODE_NAMES[b.blockModeIndex] + ":" + b.extensionIndex;
  return "plain:" + b.degreeIndex;
}
function fullSignatureSeq(blocks) { return blocks.map(blockSignature); }

// A block that borrows a specific mode at a specific degree, matched
// independent of position -- Unit 2 (and the Backdoor Dominant in Unit 5)
// are each about noticing ONE such chord appear, wherever it lands.
// requireExtension: the Backdoor Dominant only counts once it actually has
// its 7th -- the plain triad there is just a borrowed vii, not a dominant.
var BORROWED_CHORD_LIBRARY = [

function findLesson(lessonId) {
  var found = null;
  CURRICULUM.forEach(function (unit) { (unit.lessons || []).forEach(function (l) { if (l.id === lessonId) found = l; }); });
  return found;
}
function markLessonComplete(lessonId) {
  var list = projectsStore.learnProgress.completedLessons;
  if (list.indexOf(lessonId) < 0) list.push(lessonId);
  save();
}

function switchToLearnHome() {
  if (playback.active) stopPlayback();
  if (currentView === "song") {
    // Entering Learn fresh from the real project -- save its root/mode now,
    // before any lesson gets a chance to override them. A return trip from
    // a lesson back to Learn Home (currentView === "section") does NOT
    // re-save here, since the override is already in effect at that point.
    preLearnMasterRootIndex = state.masterRootIndex;
    preLearnMasterModeIndex = state.masterModeIndex;
  }
  currentView = "learnHome";
  editingRef = null; editingBlocks = null;
  document.getElementById("songViewContainer").classList.add("hidden-view");
  document.getElementById("sectionViewContainer").classList.add("hidden-view");
  document.getElementById("learnHomeContainer").classList.remove("hidden-view");
  document.getElementById("timeline").innerHTML = ""; // the lesson's own intro/reveal lived in here -- clear it rather than leaving it stale in the hidden DOM until the next render happens to touch it
  renderLearnHomeBody();
}

function renderLearnHomeBody() {
  var body = document.getElementById("learnHomeBody");
  body.innerHTML = "";
  CURRICULUM.forEach(function (unit) {
    var h = document.createElement("div");
    h.className = "learn-unit-title";
    h.textContent = unit.title;
    body.appendChild(h);
    if (unit.comingSoon) {
      var row = document.createElement("button");
      row.className = "pill learn-lesson-row";
      row.textContent = "Coming soon";
      row.disabled = true;
      body.appendChild(row);
      return;
    }
    unit.lessons.forEach(function (lesson) {
      var row = document.createElement("button");
      row.className = "pill learn-lesson-row";
      var done = projectsStore.learnProgress.completedLessons.indexOf(lesson.id) >= 0;
      row.innerHTML = (done ? '<span class="check">&#10003;</span>' : "") + lesson.title;
      row.addEventListener("click", function () { openLesson(lesson.id); });
      body.appendChild(row);
    });
  });
}

// Loads a lesson's starting example into the sandbox and switches to the
// SAME timeline/editor real songwriting uses -- editingRef just points
// somewhere new, exactly like opening a section or an arrangement slot.
function openLesson(lessonId) {
  var lesson = findLesson(lessonId);
  if (!lesson) return;
  if (playback.active) stopPlayback();
  // Every lesson plays in C, but its HOME MODE is its own (Ionian unless a
  // lesson specifies otherwise) -- a minor-key lesson needs Aeolian as home
  // so its diatonic degrees, and the "Thru" chords built from them, are
  // actually in C minor, not silently built from whatever mode the user's
  // real project happened to be left in (switchToLearnHome saved that
  // already; switchToSongView hands it back on the way out).
  state.masterRootIndex = 0;
  state.masterModeIndex = lesson.masterMode !== undefined ? lesson.masterMode : 0;
  sandbox = {title: lesson.title, blocks: lesson.blocks(), lessonId: lessonId};
  editingRef = {kind: "scratch"};
  editingBlocks = sandbox.blocks;
  state.currentIndex = 0;
  currentView = "section";
  document.getElementById("songViewContainer").classList.add("hidden-view");
  document.getElementById("learnHomeContainer").classList.add("hidden-view");
  document.getElementById("sectionViewContainer").classList.remove("hidden-view");
  updateSectionNameButton();
  applyEditorLock();
  refresh(); // renders the editor's content FIRST -- snapEditorPanel measures its real height, so it has to run after
  snapEditorPanel();
}

// Recomputes live, on every edit -- not gated behind a Play button, since
// the whole point is noticing something as you change it. Only names the
// theory once something recognizable is actually there; otherwise invites
// continued exploration rather than showing an error.
function updateLessonReveal() {
  var el = document.getElementById("lessonReveal");
  if (!el) return;
  var found = describeProgression(sandbox.blocks);
  el.classList.toggle("found", !!found);
  if (found) {
    el.textContent = found.name + " \u2014 " + found.reveal;
    if (sandbox.lessonId) markLessonComplete(sandbox.lessonId);
  } else {
    el.textContent = "Keep exploring \u2014 try another degree and see what you find.";
  }
}

document.getElementById("songLearnBtn").addEventListener("click", switchToLearnHome);
document.getElementById("learnHomeBackBtn").addEventListener("click", switchToSongView);

renderSongView();
